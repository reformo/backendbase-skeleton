services:
  redis:
    image: redis/redis-stack:7.4.0-v8@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7
    container_name: backendbase-redis
    ports:
      - "127.0.0.1:${BACKENDBASE_DEV_REDIS_PORT:-6379}:6379"
      - "127.0.0.1:${BACKENDBASE_DEV_REDIS_INSIGHT_PORT:-8001}:8001"
    volumes:
      - ./var/docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backendbase_net
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    container_name: backendbase-db
    ports:
      - "127.0.0.1:${BACKENDBASE_DEV_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./var/docker-data/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${BACKENDBASE_DEV_MYSQL_ROOT_PASSWORD:-backendbase_root!}
      MYSQL_DATABASE: ${BACKENDBASE_DEV_MYSQL_DATABASE:-backendbase}
      MYSQL_USER: ${BACKENDBASE_DEV_MYSQL_USER:-backendbase_user}
      MYSQL_PASSWORD: ${BACKENDBASE_DEV_MYSQL_PASSWORD:-backendbase+dev-}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backendbase_net
  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:06fb591136a49e861e01aaaf9ce45085839ca23c35913d45a1e83519bb9778ca
    container_name: backendbase-rabbitmq
    hostname: backendbase-rabbitmq
    ports:
      - "127.0.0.1:${BACKENDBASE_DEV_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${BACKENDBASE_DEV_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${BACKENDBASE_DEV_RABBITMQ_USER:-backendbase}
      RABBITMQ_DEFAULT_PASS: ${BACKENDBASE_DEV_RABBITMQ_PASSWORD:-backendbase}
      RABBITMQ_DEFAULT_VHOST: ${BACKENDBASE_DEV_RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backendbase_net
  ministack:
    image: ministackorg/ministack:1.5.14@sha256:62c0ac878ea843596c481c2cf9a6d1f12d6e310209b50e0ab60fde3f38022c98
    container_name: backendbase-ministack
    ports:
      - "127.0.0.1:${BACKENDBASE_DEV_AWS_PORT:-4566}:4566"
    environment:
      SERVICES: s3,sqs,sns,ses,cloudfront
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      MINISTACK_REGION: ${AWS_REGION:-eu-central-1}
      MINISTACK_HOST: 127.0.0.1
      AWS_SQS_QUEUE: ${AWS_SQS_QUEUE:-backendbase-queue}
      BUCKET_NAME: ${BUCKET_NAME:-backendbase-v3}
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
    volumes:
      - ministack_state:/tmp/ministack-state
      - ministack_s3:/tmp/ministack-data/s3
    post_start:
      - command:
          - /bin/sh
          - -ec
          - |
            count=0
            until python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4566/_ministack/health", timeout=2)' >/dev/null 2>&1; do
              count=$$((count + 1))
              if [ "$$count" -ge 30 ]; then exit 1; fi
              sleep 1
            done
            if ! aws --endpoint-url=http://127.0.0.1:4566 s3api head-bucket --bucket "$$BUCKET_NAME" >/dev/null 2>&1; then
              aws --endpoint-url=http://127.0.0.1:4566 s3 mb "s3://$$BUCKET_NAME" --region "$$AWS_DEFAULT_REGION"
            fi
            if ! aws --endpoint-url=http://127.0.0.1:4566 sqs get-queue-url --queue-name "$$AWS_SQS_QUEUE" >/dev/null 2>&1; then
              aws --endpoint-url=http://127.0.0.1:4566 sqs create-queue --queue-name "$$AWS_SQS_QUEUE"
            fi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backendbase_net
  cdn:
    image: nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    container_name: backendbase-cdn
    ports:
      - "127.0.0.1:${BACKENDBASE_DEV_CDN_PORT:-8081}:80"
    environment:
      BUCKET_NAME: ${BUCKET_NAME:-backendbase-v3}
      NGINX_ENVSUBST_FILTER: ^BUCKET_NAME$
    volumes:
      - ./resources/docker/cdn.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      ministack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backendbase_net
  stackport:
    image: davireis/stackport:0.4.3@sha256:62931f2183b52f11281cacc4149569c769aa4e3f327452da9620fb773f20af68
    container_name: backendbase-stackport
    ports:
      - "127.0.0.1:${BACKENDBASE_DEV_STACKPORT_PORT:-8082}:8080"
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      ministack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backendbase_net

networks:
  backendbase_net:
    driver: "bridge"

volumes:
  rabbitmq_data:
  ministack_state:
  ministack_s3:
