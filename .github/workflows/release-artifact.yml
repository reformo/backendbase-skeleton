name: Release artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed commit, branch, or tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.ref }}-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build reviewed release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release

    env:
      BACKENDBASE_SERVICE_TESTS: '1'
      BACKENDBASE_TEST_MYSQL_PORT: '3306'
      BACKENDBASE_TEST_MYSQL_PASSWORD: backendbase_adr_ci
      BACKENDBASE_TEST_REDIS_PORT: '6379'
      BACKENDBASE_TEST_REDIS_PASSWORD: ''
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: backendbase_adr_ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=backendbase_adr_ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.ref }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, fileinfo, json, libxml, mbstring, pdo_mysql, pdo_sqlite, redis, simplexml, sockets, sodium
          coverage: xdebug
          tools: composer:2.10.3

      - name: Validate dependencies
        run: |
          composer validate --strict --no-check-publish --no-plugins --no-scripts
          composer audit --locked --no-interaction --no-plugins --no-scripts
          composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          php bin/composer-supply-chain.php check
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Run release gates
        run: |
          bash bin/tests/redis-failover.sh composer run test
          composer run phpstan
          composer run complexity
          composer run cs-check
          composer run docs:check-links
          composer run reports:check
          composer run generate-example-api-spec
          composer run validate-example-api-spec
          composer run generate-identity-api-specs
          composer run validate-identity-api-specs
          vendor/bin/php-openapi validate --silent public/example-api/docs/example-api-merged.yml

      - name: Build immutable artifact
        id: release
        run: |
          revision="$(git rev-parse HEAD)"
          bin/deployment/build-release.sh "$revision" artifacts/releases
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Upload immutable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backendbase-${{ steps.release.outputs.revision }}
          path: |
            artifacts/releases/backendbase-${{ steps.release.outputs.revision }}.tar.gz
            artifacts/releases/backendbase-${{ steps.release.outputs.revision }}.tar.gz.sha256
            resources/security/composer-sbom.cdx.json
            resources/security/composer-package-content.json
          if-no-files-found: error
          retention-days: 30
