name: Quality gates

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BACKENDBASE_SERVICE_TESTS: '1'
      BACKENDBASE_TEST_MYSQL_PORT: '3306'
      BACKENDBASE_TEST_MYSQL_PASSWORD: backendbase_adr_ci
      BACKENDBASE_TEST_REDIS_PORT: '6379'
      BACKENDBASE_TEST_REDIS_PASSWORD: ''
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: backendbase_adr_ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=backendbase_adr_ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, fileinfo, json, libxml, mbstring, pdo_mysql, pdo_sqlite, redis, simplexml, sockets, sodium
          coverage: pcov
          ini-values: zend.assertions=1
          tools: composer:2.10.3

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish --no-plugins --no-scripts

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction --no-plugins --no-scripts

      - name: Verify Composer package contents without executing dependency code
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          php bin/composer-supply-chain.php check

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPUnit
        run: bash bin/tests/redis-failover.sh composer run test

      - name: Run PHPStan
        run: composer run phpstan

      - name: Check cyclomatic complexity
        run: composer run complexity

      - name: Run PHPCS
        run: composer run cs-check

      - name: Validate documentation links
        run: composer run docs:check-links

      - name: Verify generated report metrics
        run: composer run reports:check

      - name: Validate OpenAPI
        run: |
          composer run validate-example-api-spec
          composer run generate-example-api-spec
          composer run validate-identity-api-specs
          composer run generate-identity-api-specs
          git diff --exit-code -- public/example-api/docs/example-api-merged.yml public/user-api/docs/user-api-merged.yml public/system-admin-api/docs/system-admin-api-merged.yml
