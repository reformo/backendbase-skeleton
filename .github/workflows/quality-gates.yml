name: Quality gates

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, fileinfo, json, libxml, mbstring, pdo_mysql, pdo_sqlite, redis, simplexml, sockets
          coverage: pcov
          tools: composer:2.10.3

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish --no-plugins --no-scripts

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction --no-plugins --no-scripts

      - name: Verify Composer package contents without executing dependency code
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          php bin/composer-supply-chain.php check

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPUnit
        run: composer run test

      - name: Run PHPStan
        run: composer run phpstan

      - name: Check cyclomatic complexity
        run: composer run complexity

      - name: Run PHPCS
        run: composer run cs-check

      - name: Validate documentation links
        run: composer run docs:check-links

      - name: Verify generated report metrics
        run: composer run reports:check

      - name: Validate OpenAPI
        run: |
          composer run validate-example-api-spec
          composer run generate-example-api-spec
          git diff --exit-code -- public/example-api/docs/example-api-merged.yml
