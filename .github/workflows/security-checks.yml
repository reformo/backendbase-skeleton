name: Security checks

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Semgrep
        run: semgrep scan --config resources/security/semgrep/default.yml --error --metrics=off src config public bin resources/database

  dast:
    name: DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKENDBASE_ENV: production
      BACKENDBASE_DB_DSN: mysql://backendbase_ci:backendbase_ci_password@127.0.0.1:3306/backendbase?charset=utf8mb4
      BACKENDBASE_REDIS_HOST: 127.0.0.1
      BACKENDBASE_REDIS_PORT: 6379
      BACKENDBASE_RABBITMQ_HOST: 127.0.0.1
      BACKENDBASE_RABBITMQ_PORT: 5672
      BACKENDBASE_RABBITMQ_USER: backendbase
      BACKENDBASE_RABBITMQ_PASSWORD: backendbase
      BACKENDBASE_RABBITMQ_VHOST: /
      BACKENDBASE_RABBITMQ_QUEUE: backendbase-queue
      BACKENDBASE_RABBITMQ_EXCHANGE: backendbase
      EXAMPLE_API_KEY: dast-example-api-key
      docker: '1'

    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: backendbase_ci_root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: backendbase
          MYSQL_USER: backendbase_ci
          MYSQL_PASSWORD: backendbase_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=backendbase_ci_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:4.3.5-management@sha256:06fb591136a49e861e01aaaf9ce45085839ca23c35913d45a1e83519bb9778ca
        env:
          RABBITMQ_DEFAULT_USER: backendbase
          RABBITMQ_DEFAULT_PASS: backendbase
          RABBITMQ_DEFAULT_VHOST: /
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, fileinfo, json, libxml, mbstring, pdo_mysql, pdo_sqlite, redis, simplexml, sockets, sodium
          coverage: none
          tools: composer:2.10.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Composer package contents without executing dependency code
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          php bin/composer-supply-chain.php check

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install Bruno CLI
        run: npm install --global @usebruno/cli@4.0.0

      - name: Run database migrations
        run: bin/doctrine migrations:migrate --no-interaction

      - name: Generate and validate OpenAPI
        run: |
          composer generate-example-api-spec
          composer validate-example-api-spec
          composer generate-identity-api-specs
          composer validate-identity-api-specs
          vendor/bin/php-openapi validate --silent public/example-api/docs/example-api-merged.yml

      - name: Verify identity HTTP boundaries and authenticated scans
        env:
          BACKENDBASE_SERVICE_TESTS: '1'
          BACKENDBASE_TEST_MYSQL_PORT: '3306'
          BACKENDBASE_TEST_MYSQL_PASSWORD: backendbase_ci_root
          BACKENDBASE_TEST_REDIS_PORT: '6379'
          BACKENDBASE_TEST_REDIS_PASSWORD: ''
        run: python3 tests/Security/identity_http.py --scan

      - name: Upload identity verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-http-security-${{ github.sha }}
          path: |
            artifacts/identity-http.json
            artifacts/zap-identity
          if-no-files-found: error
          retention-days: 30

      - name: Prepare OpenAPI scan contract
        run: |
          mkdir -p artifacts/zap
          php -r '
          require "vendor/autoload.php";
          $specification = Symfony\Component\Yaml\Yaml::parseFile("public/example-api/docs/example-api-merged.yml");
          unset($specification["paths"]["/_status/ready"]);
          foreach (array_keys($specification["paths"]) as $path) {
              if (str_starts_with($path, "/auth/") || str_starts_with($path, "/identity")) {
                  unset($specification["paths"][$path]);
              }
          }
          file_put_contents(
              "artifacts/zap/example-api-openapi.yml",
              Symfony\Component\Yaml\Yaml::dump($specification, 20, 2, Symfony\Component\Yaml\Yaml::DUMP_OBJECT_AS_MAP),
          );
          '
          vendor/bin/php-openapi validate --silent artifacts/zap/example-api-openapi.yml

      - name: Configure Example API authentication
        run: |
          php -r '
          foreach (["BACKENDBASE_USER_JWT_KEY", "BACKENDBASE_ADMIN_JWT_KEY", "BACKENDBASE_IDENTITY_ENCRYPTION_KEY"] as $name) {
              echo $name . "=" . base64_encode(random_bytes(32)) . PHP_EOL;
          }
          ' >> "$GITHUB_ENV"
          echo 'BACKENDBASE_USER_JWT_ISSUER=https://user.example.test' >> "$GITHUB_ENV"
          echo 'BACKENDBASE_USER_JWT_AUDIENCE=user-api' >> "$GITHUB_ENV"
          echo 'BACKENDBASE_ADMIN_JWT_ISSUER=https://admin.example.test' >> "$GITHUB_ENV"
          echo 'BACKENDBASE_ADMIN_JWT_AUDIENCE=system-admin-api' >> "$GITHUB_ENV"
          echo 'BACKENDBASE_IDENTITY_TOKEN_LIFETIME_SECONDS=3600' >> "$GITHUB_ENV"

      - name: Start Example API
        run: |
          php -d expose_php=0 -S 127.0.0.1:8080 -t public > "$RUNNER_TEMP/backendbase-dast.log" 2>&1 &

      - name: Wait for Example API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --header 'X-Source-Id: example' \
              --header 'Backendbase-Api-Key: dast-example-api-key' \
              http://127.0.0.1:8080/example-api/ > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          cat "$RUNNER_TEMP/backendbase-dast.log"
          exit 1

      - name: Check provisioned dependencies
        run: |
          readinessResponse="$RUNNER_TEMP/dast-readiness-response.json"
          readinessStatus="$(
            curl --silent --show-error \
              --output "$readinessResponse" \
              --write-out '%{http_code}' \
              --header 'X-Source-Id: example' \
              http://127.0.0.1:8080/example-api/_status/ready
          )"
          if [[ "$readinessStatus" == '503' ]] && jq --exit-status '
              .checks.mysql == "ready"
              and .checks.redis == "ready"
              and .checks.queue == "ready"
              and .checks.objectStore == "unavailable"
            ' "$readinessResponse" > /dev/null; then
            exit 0
          fi

          echo "Readiness returned HTTP $readinessStatus with an unexpected dependency state."
          cat "$readinessResponse"
          exit 1

      - name: Create Example API scan session
        run: |
          fixtureSuffix="$(php -r 'echo random_int(100000000, 999999999);')"
          BACKENDBASE_HTTP_FIXTURE_SUFFIX="$fixtureSuffix" php tests/Security/http-fixture.php seed > /dev/null
          loginPayload="$(jq --null-input --compact-output --arg identifier "operator-$fixtureSuffix@example.test" '{identifier: $identifier, password: "http-fixture-password"}')"
          sessionFile="$RUNNER_TEMP/example-api-session.json"
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 \
            --request POST \
            --header "Backendbase-Api-Key: $EXAMPLE_API_KEY" \
            --header 'X-Source-Id: example' \
            --header 'Content-Type: application/json' \
            --data "$loginPayload" \
            --output "$sessionFile" \
            http://127.0.0.1:8080/example-api/auth/login
          accessToken="$(jq --exit-status --raw-output '.session.accessToken | select(type == "string" and length > 0)' "$sessionFile")"
          echo "::add-mask::$accessToken"
          echo "DAST_USER_TOKEN=$accessToken" >> "$GITHUB_ENV"
          rm "$sessionFile"

      - name: Run Bruno authenticated Example write sequence
        run: >-
          bin/bruno example-api local example
          --env-var "apiKey=$EXAMPLE_API_KEY"
          --env-var "accessToken=$DAST_USER_TOKEN"
          --bail

      - name: Create DAST write fixture
        id: dast-fixture
        run: |
          exampleKey="zap-scan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixturePayload="$(jq --null-input --compact-output --arg exampleKey "$exampleKey" '{
            typeTargetId: null,
            lookupKey: $exampleKey,
            lookupValue: "ZAP seed value",
            details: {source: "dast"},
            isActive: true
          }')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Backendbase-Api-Key: $EXAMPLE_API_KEY" \
            --header "Authorization: Bearer $DAST_USER_TOKEN" \
            --header 'X-Source-Id: example' \
            --header 'The-Timezone-IANA: Europe/Istanbul' \
            --header 'Content-Type: application/json' \
            --data "$fixturePayload" \
            http://127.0.0.1:8080/example-api/example-types/system/groups/zap-scan/examples

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Backendbase-Api-Key: $EXAMPLE_API_KEY" \
            --header "Authorization: Bearer $DAST_USER_TOKEN" \
            --header 'X-Source-Id: example' \
            --header 'The-Timezone-IANA: Europe/Istanbul' \
            --header 'Content-Type: application/json' \
            --data '{"lookupValue":"ZAP patched value","typeTargetId":null}' \
            "http://127.0.0.1:8080/example-api/example-types/system/groups/zap-scan/examples/$exampleKey"

          echo "example-key=$exampleKey" >> "$GITHUB_OUTPUT"

      - name: Verify access and input boundaries
        run: |
          assertStatus() {
            expectedStatus="$1"
            description="$2"
            shift 2
            responseFile="$RUNNER_TEMP/dast-boundary-response.json"
            actualStatus="$(curl --silent --show-error --output "$responseFile" --write-out '%{http_code}' "$@")"
            if [[ "$actualStatus" == "$expectedStatus" ]]; then
              return
            fi

            echo "$description returned HTTP $actualStatus; expected $expectedStatus."
            cat "$responseFile"
            exit 1
          }

          validPayload='{"lookupKey":"boundary-test","lookupValue":"value","typeTargetId":null}'
          writeUrl='http://127.0.0.1:8080/example-api/example-types/system/groups/zap-scan/examples'

          assertStatus 401 'Missing API key' \
            --header 'X-Source-Id: example' \
            http://127.0.0.1:8080/example-api/
          assertStatus 401 'Invalid API key' \
            --header 'Backendbase-Api-Key: invalid-api-key' \
            --header 'X-Source-Id: example' \
            http://127.0.0.1:8080/example-api/
          assertStatus 401 'Missing API key on write' \
            --request POST \
            --header 'X-Source-Id: example' \
            --header 'Content-Type: application/json' \
            --data "$validPayload" \
            "$writeUrl"
          assertStatus 401 'Invalid API key on write' \
            --request POST \
            --header 'Backendbase-Api-Key: invalid-api-key' \
            --header 'X-Source-Id: example' \
            --header 'Content-Type: application/json' \
            --data "$validPayload" \
            "$writeUrl"
          assertStatus 401 'Missing bearer token on write' \
            --request POST \
            --header "Backendbase-Api-Key: $EXAMPLE_API_KEY" \
            --header 'X-Source-Id: example' \
            --header 'Content-Type: application/json' \
            --data "$validPayload" \
            "$writeUrl"
          assertStatus 400 'Invalid request input' \
            --request POST \
            --header "Backendbase-Api-Key: $EXAMPLE_API_KEY" \
            --header "Authorization: Bearer $DAST_USER_TOKEN" \
            --header 'X-Source-Id: example' \
            --header 'The-Timezone-IANA: Europe/Istanbul' \
            --header 'Content-Type: application/json' \
            --data '{"lookupValue":[]}' \
            http://127.0.0.1:8080/example-api/example-types/not-a-type/groups/zap-scan/examples

      - name: Run OWASP ZAP OpenAPI scan
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ env.DAST_USER_TOKEN }}
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
          EXAMPLE_KEY: ${{ steps.dast-fixture.outputs.example-key }}
        run: |
          mkdir -p artifacts/zap/raw
          chmod a+w artifacts/zap/raw
          scanStatus=0
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py -t artifacts/zap/example-api-openapi.yml -f openapi \
            -c .zap/rules.tsv -a -T 10 -O http://127.0.0.1:8080/example-api \
            -J artifacts/zap/raw/report_json.json -w artifacts/zap/raw/report_md.md -r artifacts/zap/raw/report_html.html \
            -z "-config replacer.full_list(0).description=ExampleApiKey -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Backendbase-Api-Key -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=$EXAMPLE_API_KEY -config replacer.full_list(1).description=SourceId -config replacer.full_list(1).enabled=true -config replacer.full_list(1).matchtype=REQ_HEADER -config replacer.full_list(1).matchstr=X-Source-Id -config replacer.full_list(1).regex=false -config replacer.full_list(1).replacement=example -config formhandler.fields.field(0).fieldId=typeSlug -config formhandler.fields.field(0).value=system -config formhandler.fields.field(0).enabled=true -config formhandler.fields.field(1).fieldId=exampleGroup -config formhandler.fields.field(1).value=zap-scan -config formhandler.fields.field(1).enabled=true -config formhandler.fields.field(2).fieldId=exampleKey -config formhandler.fields.field(2).value=$EXAMPLE_KEY -config formhandler.fields.field(2).enabled=true -config formhandler.fields.field(3).fieldId=lookupKey -config formhandler.fields.field(3).value=$EXAMPLE_KEY -config formhandler.fields.field(3).enabled=true -config formhandler.fields.field(4).fieldId=lookupValue -config formhandler.fields.field(4).value=zap-scan-value -config formhandler.fields.field(4).enabled=true" || scanStatus=$?
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          destination = Path("artifacts/zap-example")
          destination.mkdir(parents=True, exist_ok=True)
          for name in ("report_json.json", "report_md.md", "report_html.html"):
              source = Path("artifacts/zap/raw") / name
              if source.exists():
                  content = source.read_text().replace(os.environ["DAST_USER_TOKEN"], "[redacted]")
                  content = content.replace(os.environ["EXAMPLE_API_KEY"], "[redacted]")
                  (destination / name).write_text(content)
          PYTHON
          exit "$scanStatus"

      - name: Upload sanitized Example scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-api-report
          path: artifacts/zap-example
          if-no-files-found: warn
          retention-days: 30

      - name: Show server log on failure
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/backendbase-dast.log" || exit 0
          cat "$RUNNER_TEMP/backendbase-dast.log"
