post:
  tags: [Identity]
  operationId: systemadminAuthenticatedContactResend
  summary: 'Resend contact verification'
  description: 'Codes expire after five minutes. User registration requires mobile verification less than 12 hours ago. Email verification is optional before registration and available after login. Admin verification is optional and preserves existing access.'
  security: [{bearerToken: []}]
  parameters:
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - name: X-Source-Id
      in: header
      required: true
      schema:
        type: string
        enum: [system-admin]
    - name: contact-info-id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../system-admin-api-openapi.yml#/components/schemas/ContactResend'
  responses:
    200:
      description: 'Contact verification state'
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [contactInfo]
            properties:
              contactInfo:
                $ref: '../system-admin-api-openapi.yml#/components/schemas/ContactInfo'
    400:
      description: 'Invalid input'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    401:
      description: 'Verification denied'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    403:
      description: 'Access denied'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    409:
      description: 'Verification conflict'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    410:
      description: 'Verification expired'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    429:
      description: 'Verification limit reached'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    503:
      description: 'Verification dependency unavailable'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
