        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    409:
      description: 'Identity conflict'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    503:
      description: 'Authentication dependency unavailable'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
  requestBody:
    required: true
    description: 'Strict JSON object. Unknown fields and type coercion are rejected. The raw body limit is 65536 bytes before parsing.'
    content:
      application/json:
        schema:
          $ref: '../system-admin-api-openapi.yml#/components/schemas/LoginInput'
