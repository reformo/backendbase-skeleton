                $ref: '../system-admin-api-openapi.yml#/components/schemas/Challenge'
    400:
      description: 'Invalid request'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    401:
      description: 'Authentication denied'
