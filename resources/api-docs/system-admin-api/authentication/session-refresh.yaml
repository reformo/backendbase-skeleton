post:
  tags:
    - Authentication
  operationId: systemadminRefreshSession
  summary: 'Renew the access token and rotate the refresh token'
  parameters:
    - $ref: '../../common/components.yaml#/headers/Idempotency-Key'
    -
      $ref: '../../common/components.yaml#/headers/Accept-Language'
    -
      $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    -
      $ref: '../../common/components.yaml#/headers/X-Request-Id'
    -
      name: X-Source-Id
      in: header
      required: true
      schema:
        type: string
        enum:
          - system-admin
  description: 'Authenticate with the refresh credential before idempotency replay. Reuse the same key and body for retries. A new key with a consumed refresh token revokes the session.'
  security: []
  responses:
    403:
      description: 'Cookie transport requires an exact configured Origin'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    429:
      $ref: '../../common/components.yaml#/schemas/429'
    422:
      $ref: '../../common/components.yaml#/schemas/422'
    500:
      $ref: '../../common/components.yaml#/schemas/500'
    200:
      description: 'Completed operation'
      headers:
        Set-Cookie:
          description: 'Cookie transport only. Secure, HttpOnly, SameSite=Strict, Path=/; absolute session expiry.'
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - session
            properties:
              session:
                $ref: '../system-admin-api-openapi.yml#/components/schemas/Session'
    400:
      description: 'Invalid request'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    401:
      description: 'Authentication denied'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    409:
      description: 'Identity conflict'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
    503:
      description: 'Authentication dependency unavailable'
      content:
        application/problem+json:
          schema:
            $ref: '../system-admin-api-openapi.yml#/components/schemas/Problem'
  requestBody:
    required: true
    description: 'Strict JSON object. Unknown fields and type coercion are rejected. The raw body limit is 65536 bytes before parsing.'
    content:
      application/json:
        schema:
          $ref: '../system-admin-api-openapi.yml#/components/schemas/RefreshSessionInput'
