openapi: 3.0.0
info:
  title: 'Backendbase ADMIN API'
  version: 1.0.0
  description: 'Realm-specific password authentication. Contact ownership verification is a separate gate. Admin enrollment also requires invitation and approval.'
servers:
  -
    url: 'http://127.0.0.1:8080/system-admin-api'
paths:
  '/identity/contact-verifications/{contact-info-id}/resend':
    $ref: './identity/contact-resend.yaml'
  '/identity/contact-verifications/{contact-info-id}/confirm':
    $ref: './identity/contact-confirmation.yaml'
  '/identity/contact-verifications':
    $ref: './identity/contact-verification.yaml'
  '/auth/contact-verifications/{contact-info-id}/resend':
    $ref: './authentication/contact-resend.yaml'
  '/auth/contact-verifications/{contact-info-id}/confirm':
    $ref: './authentication/contact-confirmation.yaml'
  '/auth/contact-verifications':
    $ref: './authentication/contact-verification.yaml'
  /auth/login:
    $ref: "./authentication/login.yaml"
  /identity:
    $ref: "./identity/current.yaml"
  /identity/token:
    $ref: "./identity/token.yaml"
  /identity/session:
    $ref: "./identity/session.yaml"
  /identity/account:
    $ref: "./identity/account.yaml"
  /administration/admins/invite:
    $ref: "./administration/admins-invite.yaml"
  /administration/admins/approve:
    $ref: "./administration/admins-approve.yaml"
  /administration/actors/change:
    $ref: "./administration/actors-change.yaml"
  '/administration/actors/{realm}/{actor-id}':
    $ref: "./administration/actor-history.yaml"
  /_status:
    $ref: "./system/liveness.yaml"
  /_status/ready:
    $ref: "./system/readiness.yaml"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistrationInput:
      type: object
      additionalProperties: false
      required:
        - email
        - mobile
        - password
        - emailContactInfoId
        - mobileContactInfoId
        - verificationContextToken
      properties:
        firstName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 160
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
        lastName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 160
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
        emailContactInfoId:
          type: string
          format: uuid
        mobileContactInfoId:
          type: string
          format: uuid
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
        email:
          type: string
          format: email
          maxLength: 254
          description: 'ASCII email address normalized to lowercase.'
        mobile:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: 'UTF-8, at most 512 bytes, without null bytes.'
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          description: 'Account email or E.164 mobile number.'
          oneOf:
            - type: string
              format: email
              maxLength: 254
              pattern: '^[\x21-\x7e]+@[\x21-\x7e]+$'
            - type: string
              minLength: 3
              maxLength: 16
              pattern: '^\+[1-9][0-9]{1,14}$'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: 'UTF-8, at most 512 bytes, without null bytes.'
    Registration:
      type: object
      additionalProperties: false
      required:
        - accountId
        - actorId
      properties:
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
    VerificationContextToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      writeOnly: true
      description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
    ContactRequest:
      type: object
      additionalProperties: false
      required: [contactType, contactValue, verificationContextToken]
      properties:
        contactType:
          type: string
          enum: [email, mobile]
        contactValue:
          type: string
          maxLength: 254
          description: 'ASCII email or E.164 mobile, according to contactType.'
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
    AdminContactRequest:
      type: object
      additionalProperties: false
      required: [identifier, password, contactType, verificationContextToken]
      properties:
        identifier:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        contactType:
          type: string
          enum: [email, mobile]
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
    AuthenticatedContactRequest:
      type: object
      additionalProperties: false
      required: [contactType, verificationContextToken]
      properties:
        contactType:
          type: string
          enum: [email, mobile]
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
    ContactConfirmation:
      type: object
      additionalProperties: false
      required: [verificationContextToken, code]
      properties:
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    ContactResend:
      type: object
      additionalProperties: false
      required: [verificationContextToken]
      properties:
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
    ContactInfo:
      type: object
      additionalProperties: false
      required: [contactInfoId, contactType, codeExpiresAt, resendAfter, verifiedAt, registrationValidUntil, deliveryState]
      properties:
        contactInfoId:
          type: string
          format: uuid
        contactType:
          type: string
          enum: [email, mobile]
        codeExpiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        registrationValidUntil:
          type: string
          format: date-time
          nullable: true
        deliveryState:
          type: string
          enum: [pending, accepted, unknown]
    Completed:
      type: object
      additionalProperties: false
      required:
        - completed
      properties:
        completed:
          type: boolean
          enum:
            - true
    Session:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
    Identity:
      type: object
      additionalProperties: false
      required:
        - accountId
        - actorId
        - realm
        - email
        - mobile
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 160
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
        lastName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 160
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
        email:
          type: string
          format: email
          maxLength: 254
          description: 'ASCII email address normalized to lowercase.'
        mobile:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        realm:
          type: string
          enum:
            - USER
            - ADMIN
    AdminInvitationInput:
      type: object
      additionalProperties: false
      required:
        - accountId
        - evidence
      properties:
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        evidence:
          type: string
          minLength: 1
          maxLength: 160
    AdminApprovalInput:
      type: object
      additionalProperties: false
      required:
        - actorId
        - evidence
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        evidence:
          type: string
          minLength: 1
          maxLength: 160
          description: 'Must differ from the invitation evidence. Self-approval is forbidden.'
    ActorChangeInput:
      type: object
      additionalProperties: false
      required:
        - actorId
        - realm
        - action
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        realm:
          type: string
          enum:
            - USER
            - ADMIN
        action:
          type: string
          enum:
            - remove
            - restore
    AdminInvitation:
      type: object
      additionalProperties: false
      required:
        - actorId
        - approved
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        approved:
          type: boolean
          enum:
            - false
    ActorHistory:
      type: object
      additionalProperties: false
      required:
        - actorId
        - accountId
        - realm
        - email
        - mobile
        - firstName
        - lastName
        - approved
        - createdAt
        - deletedAt
      properties:
        firstName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 160
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
        lastName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 160
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        realm:
          type: string
          enum:
            - USER
            - ADMIN
        email:
          type: string
          format: email
          maxLength: 254
          description: 'ASCII email address normalized to lowercase.'
        mobile:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Liveness:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - alive
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ready
              - unavailable
tags:
  - name: Authentication
    description: Registration, contact ownership, and password login.
  - name: Identity
    description: Current identity, access tokens, sessions, and account closure.
  - name: Administration
    description: Admin enrollment and actor administration.
  - name: System
    description: API liveness and dependency readiness.
