headers:
  Accept-Language:
    name: Accept-Language
    in: header
    description: selected language
    required: true
    schema:
      type: string
      default: "tr-TR"
    example: tr-TR
  The-Timezone-IANA:
    name: The-Timezone-IANA
    in: header
    description: Client's timezone
    required: true
    schema:
      type: string
      format: Timezone IANA name
      default: Europe/Istanbul
    example: Europe/Istanbul
  X-Request-Id:
    name: X-Request-Id
    in: header
    description: Trace Id for request
    required: true
    schema:
      type: string
      format: uuid
      default: 019f0325-5940-7702-8488-3cfe56553586
    example: 019f0325-5940-7702-8488-3cfe56553586
  X-Source-Id:
    name: X-Source-Id
    in: header
    description: Source Id for request
    required: true
    schema:
      type: string
      enum: ["public", "private", "example"]
      default: 'example'
    example: 'example'
schemas:
  200:
    description: OK
    content:
      application/vnd.backendbase.v1+json; language=en:
        schema:
  201:
    description: Created
    headers:
      Backendbase-Insert-Id:
        schema:
          type: string
          format: uuid
          example: 6e3ecfd1-9fa0-40ec-a1e0-edd9dd608d7e
        description: Resource insert id.
  202:
    description: Accepted
  204:
    description: No Content
    headers:
      Backendbase-Insert-Id:
        schema:
          type: string
          format: uuid
          example: 6e3ecfd1-9fa0-40ec-a1e0-edd9dd608d7e
        description: Resource insert id. May not exists always
  400:
    description: Bad Request
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/ApiProblem'
  401:
    description: Unauthorized
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/ApiProblem'
  403:
    description: Forbidden
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/ApiProblem'
  404:
    description: Not Found
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/ApiProblem'
  409:
    description: Conflict
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/ApiProblem'
  ApiProblem:
    type: object
    properties:
      type:
        type: string
        format: uri
        description: |
          An absolute URI that identifies the problem type.  When dereferenced,
          it SHOULD provide human-readable documentation for the problem type
          (e.g., using HTML).
        default: 'about:blank'
        example: 'https://zalando.github.io/problem/constraint-violation'
      code:
        type: string
        description: |
          Unique string value within the project that can be used to issue's id
        example: 'identity-and-access/forbidden'
      title:
        type: string
        description: |
          A short, summary of the problem type. Written in english and readable
          for engineers (usually not suited for non technical stakeholders and
          not localized); example: Service Unavailable
      status:
        type: integer
        format: int32
        description: |
          The HTTP status code generated by the origin server for this occurrence
          of the problem.
        minimum: 100
        maximum: 600
        exclusiveMaximum: true
        example: 503
      detail:
        type: string
        description: |
          A human readable explanation specific to this occurrence of the
          problem.
        example: Connection to database timed out
  RequestHeaders:
    type: object
    properties:
      Accept:
        type: string
        example: application/vnd.public-ready2.v1+json
      Accept-Language:
        type: string
        example: en
      Content-Type:
        type: string
        value: application/json

  securitySchemes:
    bearerAuth:
      type: http
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      description: User Id for request
      name: X-Example-Api-Key
      in: header
