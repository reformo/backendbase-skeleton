openapi: 3.0.0
info:
  title: 'Backendbase USER API'
  version: 1.0.0
  description: 'Realm-specific password and TOTP authentication. Contact ownership verification is a separate gate. Admin enrollment also requires invitation and approval.'
servers:
  -
    url: 'http://127.0.0.1:8080/user-api'
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      operationId: userRegisterUser
      summary: 'Register User'
      parameters:
        -
          $ref: '../common/components.yaml#/headers/Accept-Language'
        -
          $ref: '../common/components.yaml#/headers/The-Timezone-IANA'
        -
          $ref: '../common/components.yaml#/headers/X-Request-Id'
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            type: string
            enum:
              - user
      security: []
      responses:
        201:
          description: 'Completed operation'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - registration
                properties:
                  registration:
                    $ref: '#/components/schemas/Registration'
        400:
          description: 'Invalid request'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        401:
          description: 'Authentication denied'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        409:
          description: 'Identity conflict'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        503:
          description: 'Authentication dependency unavailable'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        description: 'Strict JSON object. Unknown fields and type coercion are rejected. The raw body limit is 65536 bytes before parsing.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
