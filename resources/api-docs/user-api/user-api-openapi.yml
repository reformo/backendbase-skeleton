components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistrationInput:
      type: object
      additionalProperties: false
      required:
        - email
        - loginName
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 'ASCII email address normalized to lowercase.'
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: 'UTF-8, at most 512 bytes, without null bytes.'
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - loginName
        - password
      properties:
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: 'UTF-8, at most 512 bytes, without null bytes.'
    ProofInput:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    Challenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - expiresIn
      properties:
        challengeId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        expiresIn:
          type: integer
          enum:
            - 300
    Registration:
      type: object
      additionalProperties: false
      required:
        - accountId
        - actorId
        - challengeId
        - expiresIn
      properties:
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        challengeId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        expiresIn:
          type: integer
          enum:
            - 300
    Enrollment:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - totpSecret
        - otpauthUri
        - expiresIn
      properties:
        challengeId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        totpSecret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
        otpauthUri:
          type: string
        expiresIn:
          type: integer
          enum:
            - 300
    Completed:
      type: object
      additionalProperties: false
      required:
        - completed
      properties:
        completed:
          type: boolean
          enum:
            - true
    Session:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
    Identity:
      type: object
      additionalProperties: false
      required:
        - accountId
        - actorId
        - realm
      properties:
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        realm:
          type: string
          enum:
            - USER
            - ADMIN
    AdminInvitationInput:
      type: object
      additionalProperties: false
      required:
        - accountId
        - loginName
        - evidence
      properties:
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        evidence:
          type: string
          minLength: 1
          maxLength: 160
    AdminApprovalInput:
      type: object
      additionalProperties: false
      required:
        - actorId
        - evidence
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        evidence:
          type: string
          minLength: 1
          maxLength: 160
          description: 'Must differ from the invitation evidence. Self-approval is forbidden.'
    ActorChangeInput:
      type: object
      additionalProperties: false
      required:
        - actorId
        - realm
        - action
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        realm:
          type: string
          enum:
            - USER
            - ADMIN
        action:
          type: string
          enum:
            - remove
            - restore
    AdminInvitation:
      type: object
      additionalProperties: false
      required:
        - actorId
        - approved
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        approved:
          type: boolean
          enum:
            - false
    ActorHistory:
      type: object
      additionalProperties: false
      required:
        - actorId
        - accountId
        - realm
        - loginName
        - approved
        - createdAt
        - deletedAt
      properties:
        actorId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        accountId:
          type: string
          format: uuid
          pattern: '^[0-9a-f-]{36}$'
        realm:
          type: string
          enum:
            - USER
            - ADMIN
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Liveness:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - alive
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ready
              - unavailable
tags:
  - name: Authentication
    description: Registration, contact ownership, enrollment, and login.
  - name: Identity
    description: Current identity, access tokens, sessions, and account closure.
  - name: System
    description: API liveness and dependency readiness.
