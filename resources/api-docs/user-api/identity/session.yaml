delete:
  tags:
    - Identity
  operationId: userEndCurrentSession
  summary: 'End current session'
  parameters:
    - $ref: '../../common/components.yaml#/headers/Idempotency-Key'
    -
      $ref: '../../common/components.yaml#/headers/Accept-Language'
    -
      $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    -
      $ref: '../../common/components.yaml#/headers/X-Request-Id'
    -
      name: X-Source-Id
      in: header
      required: true
      schema:
        type: string
        enum:
          - user
  security:
    -
      bearerToken: {}
  responses:
    422:
      $ref: '../../common/components.yaml#/schemas/422'
    500:
      $ref: '../../common/components.yaml#/schemas/500'
    200:
      description: 'Completed operation'
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - session
            properties:
              session:
                $ref: '../user-api-openapi.yml#/components/schemas/Completed'
    400:
      description: 'Invalid request'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
    401:
      description: 'Authentication denied'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
    409:
      description: 'Identity conflict'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
    503:
      description: 'Authentication dependency unavailable'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
