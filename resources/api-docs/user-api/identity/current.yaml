get:
  tags:
    - Identity
  operationId: userReadCurrentIdentity
  summary: 'Read current identity'
  parameters:
    -
      $ref: '../../common/components.yaml#/headers/Accept-Language'
    -
      $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    -
      $ref: '../../common/components.yaml#/headers/X-Request-Id'
    -
      name: X-Source-Id
      in: header
      required: true
      schema:
        type: string
        enum:
          - user
  security:
    -
      bearerToken: {}
  responses:
    429:
      $ref: '../../common/components.yaml#/schemas/429'
    200:
      description: 'Completed operation'
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - user
            properties:
              user:
                $ref: '../user-api-openapi.yml#/components/schemas/Identity'
    400:
      description: 'Invalid request'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
    401:
      description: 'Authentication denied'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
    409:
      description: 'Identity conflict'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
    503:
      description: 'Authentication dependency unavailable'
      content:
        application/problem+json:
          schema:
            $ref: '../user-api-openapi.yml#/components/schemas/Problem'
