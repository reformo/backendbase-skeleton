post:
  tags:
    - Example
  operationId: addNewExample
  description: Add new example
  parameters:
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - $ref: '../../common/components.yaml#/headers/X-Source-Id'

    - in: path
      name: type-slug
      description: Type slug
      required: true
      schema:
        type: string
        enum: [ 'system', 'user' ]
    - in: path
      name: example-group
      description: Example group
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
  requestBody:
    required: true
    description: The encoded JSON object must not exceed 65536 bytes. Unknown fields and coerced scalar types are rejected.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - lookupValue
          properties:
            typeTargetId:
              type: integer
              minimum: 1
              maximum: 9223372036854775807
              format: int64
              nullable: true
              description: Optional positive target identifier. Null selects entries without a target.
              default: null
            lookupKey:
              type: string
              minLength: 1
              maxLength: 160
              nullable: true
              format: <ulid> or string
              description: unique key. use lowercase ulid values
              example: "01hkj62kff4ndb51nxy8sasy8w"
            lookupValue:
              type: string
              maxLength: 2048
            details:
              type: object
              description: JSON object with non-integer top-level member names. Values are preserved. No image URL fields are generated.
              nullable: true
              example:
                title:
                  en: "English title"
                  tr: "Turkish Title"
                auditLog:
                  userId: 12
                  logDate: "2024-01-01T13:45:00"

            isActive:
              type: boolean
              nullable: true
              description: Omitted or null values use the API v1 default of true.
              example: true

  responses:
    204:
      $ref: '../../common/components.yaml#/schemas/204'
    400:
      $ref: '../../common/components.yaml#/schemas/400'
    409:
      $ref: '../../common/components.yaml#/schemas/409'
    401:
      $ref: '../../common/components.yaml#/schemas/401'
    403:
      $ref: '../../common/components.yaml#/schemas/403'
    503:
      description: Authentication dependency unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    404:
      $ref: '../../common/components.yaml#/schemas/404'
  security:
    - apiKey: [ ]
      bearerToken: [ ]

get:
  tags:
    - Example
  operationId: getExamplesByGroup
  description: Get examples by group, ordered by creation time and then UUID before pagination.
  parameters:
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - $ref: '../../common/components.yaml#/headers/X-Source-Id'

    - in: path
      name: type-slug
      description: Type slug
      required: true
      schema:
        type: string
        enum: [ 'system', 'user' ]
    - in: path
      name: example-group
      description: Example group
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    - in: query
      name: typeTargetId
      description: Optional positive target identifier. Omitted or empty query values select entries without a target.
      schema:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
        format: int64
        nullable: true
    - in: query
      name: pageSize
      description: Number of examples requested per page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1000
    - in: query
      name: page
      description: Requested page number. The offset (page - 1) * pageSize must not exceed 9223372036854775807. An invalid offset returns 400.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [pageSize, page, total, examples]
            properties:
              pageSize:
                type: integer
              page:
                type: integer
              total:
                type: integer
              examples:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [uuid, type, typeTargetId, exampleGroup, lookupKey, lookupValue, isActive, details, createdAt]
                  properties:
                    uuid:
                      type: string
                      format: uuid
                    type:
                      type: string
                      enum: [ 'system', 'user' ]
                      format: kebab-case
                    exampleGroup:
                      type: string
                      minLength: 1
                      maxLength: 32
                      format: kebab-case
                    typeTargetId:
                      type: integer
                      minimum: 1
                      maximum: 9223372036854775807
                      format: int64
                      nullable: true
                      description: Optional positive target identifier. Null selects entries without a target.
                    lookupKey:
                      type: string
                      minLength: 1
                      maxLength: 160
                      format: <ulid> or string
                      example: "01hkj62kff4ndb51nxy8sasy8w"
                    lookupValue:
                      type: string
                      maxLength: 2048
                    isActive:
                      type: boolean
                      example: true
                    details:
                      type: object
                      description: JSON object with non-integer top-level member names. Values are preserved. No image URL fields are generated.
                    createdAt:
                      type: string
                      format: date-time

    400:
      $ref: '../../common/components.yaml#/schemas/400'
    401:
      $ref: '../../common/components.yaml#/schemas/401'
    403:
      $ref: '../../common/components.yaml#/schemas/403'
    503:
      description: Authentication dependency unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    404:
      $ref: '../../common/components.yaml#/schemas/404'
  security:
    - apiKey: [ ]
      bearerToken: [ ]
