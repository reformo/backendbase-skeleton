get:
  tags:
    - Example
  operationId: getExampleByCriteria
  description: Get example details
  parameters:
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - $ref: '../../common/components.yaml#/headers/X-Source-Id'
    - in: path
      name: type-slug
      description: Type slug
      required: true
      schema:
        type: string
        enum: [ 'system', 'user' ]
    - in: path
      name: example-group
      description: Example group
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    - in: path
      name: example-key
      description: Example key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        format: <ulid> or string
    - in: query
      name: typeTargetId
      description: Type target id
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
        format: int64
        nullable: true
  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [example]
            properties:
              example:
                type: object
                additionalProperties: false
                required: [uuid, type, typeTargetId, exampleGroup, lookupKey, lookupValue, details, isActive, updatedAt, createdAt]
                properties:
                  uuid:
                    type: string
                    format: uuid
                  type:
                    type: string
                    enum: [ 'system', 'user' ]
                    format: kebab-case
                  exampleGroup:
                    type: string
                    minLength: 1
                    maxLength: 32
                    format: kebab-case
                  typeTargetId:
                    type: integer
                    minimum: 1
                    maximum: 9223372036854775807
                    description: Optional positive target identifier. Null selects entries without a target.
                    format: int64
                    nullable: true
                  lookupKey:
                    type: string
                    minLength: 1
                    maxLength: 160
                    format: <ulid> or string
                    example: "01hkj62kff4ndb51nxy8sasy8w"
                  lookupValue:
                    type: string
                    maxLength: 2048
                  details:
                    type: object
                    description: JSON object with non-integer top-level member names. Values are preserved. No image URL fields are generated.
                  isActive:
                    type: boolean
                    example: true
                  updatedAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time

    400:
      $ref: '../../common/components.yaml#/schemas/400'
    401:
      $ref: '../../common/components.yaml#/schemas/401'
    403:
      $ref: '../../common/components.yaml#/schemas/403'
    404:
      $ref: '../../common/components.yaml#/schemas/404'
  security:
    - apiKey: [ ]

patch:
  tags:
    - Example
  operationId: changeExampleDetails
  description: Change example details
  parameters:
    - $ref: '../../common/components.yaml#/headers/Idempotency-Key'
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - $ref: '../../common/components.yaml#/headers/X-Source-Id'

    - in: path
      name: type-slug
      description: Type slug
      required: true
      schema:
        type: string
        enum: [ 'system', 'user' ]
    - in: path
      name: example-group
      description: Example group
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    - in: path
      name: example-key
      description: Example key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        format: <ulid> or string
  requestBody:
    description: The encoded JSON object must not exceed 65536 bytes. Unknown fields are rejected. API v1 treats omitted or null update fields as unchanged.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            lookupValue:
              type: string
              maxLength: 2048
              nullable: true
            details:
              type: object
              description: JSON object with non-integer top-level member names. Values are preserved. No image URL fields are generated.
              nullable: true
            isActive:
              type: boolean
              nullable: true
              example: true
            typeTargetId:
              type: integer
              minimum: 1
              maximum: 9223372036854775807
              format: int64
              nullable: true

  responses:
    409:
      $ref: '../../common/components.yaml#/schemas/409'
    422:
      $ref: '../../common/components.yaml#/schemas/422'
    500:
      $ref: '../../common/components.yaml#/schemas/500'
    204:
      $ref: '../../common/components.yaml#/schemas/204'
    400:
      $ref: '../../common/components.yaml#/schemas/400'
    401:
      $ref: '../../common/components.yaml#/schemas/401'
    403:
      $ref: '../../common/components.yaml#/schemas/403'
    503:
      description: Authentication dependency unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    404:
      $ref: '../../common/components.yaml#/schemas/404'
  security:
    - apiKey: [ ]
      bearerToken: [ ]

