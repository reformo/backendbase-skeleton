get:
  tags:
    - Example
  operationId: getExampleGroupsByType
  description: Get example groups by type
  parameters:
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - $ref: '../../common/components.yaml#/headers/X-Source-Id'

    - in: path
      name: type-slug
      description: Type slug
      required: true
      schema:
        type: string
        enum: [ 'system', 'user', 'expert', 'admin' ]
    - in: query
      name: typeTargetId
      description: Type target id
      required: false
      schema:
        type: integer
        format: int64
        nullable: true
    - in: query
      name: pageSize
      description: Number of groups requested per page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1000
    - in: query
      name: page
      description: Requested page number. The offset (page - 1) * pageSize must not exceed 9223372036854775807. An invalid offset returns 400.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    200:
      description: "OK"
      content:
        application/json:
          schema:
            type: object
            properties:
              pageSize:
                type: integer
              page:
                type: integer
              total:
                type: integer
              exampleGroups:
                type: array
                items:
                  type: string
                  format: kebab-case

    400:
      $ref: '../../common/components.yaml#/schemas/400'
    401:
      $ref: '../../common/components.yaml#/schemas/401'
    403:
      $ref: '../../common/components.yaml#/schemas/403'
    404:
      $ref: '../../common/components.yaml#/schemas/404'
  security:
    - apiKey: [ ]
