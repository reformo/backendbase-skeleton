post:
  tags: [Identity]
  operationId: exampleAuthenticatedContactConfirm
  summary: 'Confirm contact verification'
  description: 'Verify the stored Account email after login. Codes expire after five minutes. Verification is optional and preserves existing sessions.'
  security: [{apiKey: [], bearerToken: []}]
  parameters:
    - $ref: '../../common/components.yaml#/headers/Idempotency-Key'
    - $ref: '../../common/components.yaml#/headers/Accept-Language'
    - $ref: '../../common/components.yaml#/headers/The-Timezone-IANA'
    - $ref: '../../common/components.yaml#/headers/X-Request-Id'
    - name: X-Source-Id
      in: header
      required: true
      schema:
        type: string
        enum: [example]
    - name: contact-info-id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../example-openapi.yml#/components/schemas/ContactConfirmation'
  responses:
    422:
      $ref: '../../common/components.yaml#/schemas/422'
    500:
      $ref: '../../common/components.yaml#/schemas/500'
    200:
      description: 'Contact verification state'
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [contactInfo]
            properties:
              contactInfo:
                $ref: '../example-openapi.yml#/components/schemas/ContactInfo'
    400:
      description: 'Invalid input'
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    401:
      description: 'Verification denied'
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    403:
      description: 'Access denied'
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    409:
      description: 'Verification conflict'
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    410:
      description: 'Verification expired'
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    429:
      description: 'Verification limit reached'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
    503:
      description: 'Verification dependency unavailable'
      content:
        application/problem+json:
          schema:
            $ref: '../example-openapi.yml#/components/schemas/Problem'
