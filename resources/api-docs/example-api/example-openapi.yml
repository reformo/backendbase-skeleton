openapi: 3.0.0
info:
  title: Backendbase EXAMPLE API Documentation
  description: All Backendbase EXAMPLE API endpoints are presented here.
  contact:
    email: mehmet.korkmaz@reformo.net
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/example-api
    description: EXAMPLE API Development URL
  - url: https://example.api-stage.backendbaseapp.com
    description: EXAMPLE API Stage URL
  - url: https://example.api.backendbaseapp.com
    description: EXAMPLE API Production URL
paths:
  /:
    get:
      tags:
        - System
      operationId: apiMetadata
      description: Read API build metadata
      parameters:
        - $ref: '../common/components.yaml#/headers/Accept-Language'
        - $ref: '../common/components.yaml#/headers/The-Timezone-IANA'
        - $ref: '../common/components.yaml#/headers/X-Request-Id'
        - $ref: '../common/components.yaml#/headers/X-Source-Id'
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                required:
                  - "backendbase-api"
                properties:
                  backendbase-api:
                    required:
                      - "version"
                      - "buildId"
                      - "cdnBaseUrl"
                    properties:
                      version:
                        type: "string"
                        example: "1.0.0"
                      buildId:
                        type: "string"
                        example: "0.0.1"
                      cdnBaseUrl:
                        type: "string"
                        example: ""
                    type: "object"
        401:
          $ref: '../common/components.yaml#/schemas/401'
        403:
          $ref: '../common/components.yaml#/schemas/403'
      security:
        - apiKey: [ ]
  /_status:
    get:
      tags:
        - System
      operationId: livenessCheck
      description: Check whether the API process can serve requests
      parameters:
        - $ref: '../common/components.yaml#/headers/Accept-Language'
        - $ref: '../common/components.yaml#/headers/The-Timezone-IANA'
        - $ref: '../common/components.yaml#/headers/X-Request-Id'
        - $ref: '../common/components.yaml#/headers/X-Source-Id'
      responses:
        200:
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [alive]
      security: []
  /_status/ready:
    get:
      tags:
        - System
      operationId: readinessCheck
      description: Check bounded connections to required dependencies
      parameters:
        - $ref: '../common/components.yaml#/headers/Accept-Language'
        - $ref: '../common/components.yaml#/headers/The-Timezone-IANA'
        - $ref: '../common/components.yaml#/headers/X-Request-Id'
        - $ref: '../common/components.yaml#/headers/X-Source-Id'
      responses:
        200:
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        503:
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
      security: []
  /auth:
    post:
      tags:
        - Identity & Access
      operationId: authenticateUser
      description: Authenticate user
      parameters:
        - $ref: '../common/components.yaml#/headers/Accept-Language'
        - $ref: '../common/components.yaml#/headers/The-Timezone-IANA'
        - $ref: '../common/components.yaml#/headers/X-Request-Id'
        - $ref: '../common/components.yaml#/headers/X-Source-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        201:
          description: "OK"
          content:
            application/json:
              schema:
                properties:
                  accessToken:
                    type: "string"
        401:
          $ref: '../common/components.yaml#/schemas/401'
        403:
          $ref: '../common/components.yaml#/schemas/403'
      security:
        - apiKey: [ ]

  /example-types/{typeSlug}/groups:
    $ref: "./example/example-groups.yaml"
  /example-types/{typeSlug}/groups/{exampleGroup}/examples:
    $ref: "./example/examples.yaml"
  /example-types/{typeSlug}/groups/{exampleGroup}/examples/{exampleKey}:
    $ref: "./example/example-details.yaml"

components:
  schemas:
    Readiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          required:
            - mysql
            - redis
            - queue
            - objectStore
          properties:
            mysql:
              type: string
              enum: [ready, unavailable]
            redis:
              type: string
              enum: [ready, unavailable]
            queue:
              type: string
              enum: [ready, unavailable]
            objectStore:
              type: string
              enum: [ready, unavailable]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme.
    apiKey:
      type: apiKey
      in: header
      name: Backendbase-Api-Key
tags:
  - name: System
  - name: Example
