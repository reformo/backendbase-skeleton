openapi: 3.0.0
info:
  title: Backendbase EXAMPLE API Documentation
  description: All Backendbase EXAMPLE API endpoints are presented here.
  contact:
    email: mehmet.korkmaz@reformo.net
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/example-api
    description: EXAMPLE API Development URL
  - url: https://example.api-stage.backendbaseapp.com
    description: EXAMPLE API Stage URL
  - url: https://example.api.backendbaseapp.com
    description: EXAMPLE API Production URL
paths:
  /:
    $ref: "./system/api-metadata.yaml"
  /_status:
    $ref: "./system/liveness.yaml"
  /_status/ready:
    $ref: "./system/readiness.yaml"
  /example-types/{type-slug}/groups:
    $ref: "./example/example-groups.yaml"
  /example-types/{type-slug}/groups/{example-group}/examples:
    $ref: "./example/examples.yaml"
  /example-types/{type-slug}/groups/{example-group}/examples/{example-key}:
    $ref: "./example/example-details.yaml"

components:
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          required:
            - mysql
            - redis
            - queue
            - objectStore
          properties:
            mysql:
              type: string
              enum: [ready, unavailable]
            redis:
              type: string
              enum: [ready, unavailable]
            queue:
              type: string
              enum: [ready, unavailable]
            objectStore:
              type: string
              enum: [ready, unavailable]
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Backendbase-Api-Key
tags:
  - name: System
    description: API metadata, liveness, and dependency readiness.
  - name: Example
    description: Example catalog groups and entries.
