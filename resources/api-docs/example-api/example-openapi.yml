openapi: 3.0.0
info:
  title: Backendbase EXAMPLE API Documentation
  description: All Backendbase EXAMPLE API endpoints are presented here.
  contact:
    email: mehmet.korkmaz@reformo.net
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080/example-api
    description: EXAMPLE API Development URL
  - url: https://example.api-stage.backendbaseapp.com
    description: EXAMPLE API Stage URL
  - url: https://example.api.backendbaseapp.com
    description: EXAMPLE API Production URL
paths:
  '/auth/contact-verifications/{contact-info-id}/resend':
    $ref: './authentication/contact-resend.yaml'
  '/auth/contact-verifications/{contact-info-id}/confirm':
    $ref: './authentication/contact-confirmation.yaml'
  '/auth/contact-verifications':
    $ref: './authentication/contact-verification.yaml'
  /auth/register:
    $ref: "./authentication/register.yaml"
  /auth/refresh:
    $ref: './authentication/session-refresh.yaml'
  /auth/login:
    $ref: "./authentication/login.yaml"
  '/identity/contact-verifications':
    $ref: './identity/contact-verification.yaml'
  '/identity/contact-verifications/{contact-info-id}/confirm':
    $ref: './identity/contact-confirmation.yaml'
  '/identity/contact-verifications/{contact-info-id}/resend':
    $ref: './identity/contact-resend.yaml'
  /identity:
    $ref: "./identity/current.yaml"
  /identity/token:
    $ref: "./identity/token.yaml"
  /identity/session:
    $ref: "./identity/session.yaml"
  /identity/account:
    $ref: "./identity/account.yaml"
  /:
    $ref: "./system/api-metadata.yaml"
  /_status:
    $ref: "./system/liveness.yaml"
  /_status/ready:
    $ref: "./system/readiness.yaml"
  /example-types/{type-slug}/groups:
    $ref: "./example/example-groups.yaml"
  /example-types/{type-slug}/groups/{example-group}/examples:
    $ref: "./example/examples.yaml"
  /example-types/{type-slug}/groups/{example-group}/examples/{example-key}:
    $ref: "./example/example-details.yaml"

components:
  schemas:
    AuthenticatedContactRequest:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/AuthenticatedContactRequest'
    Completed:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/Completed'
    ContactConfirmation:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/ContactConfirmation'
    ContactInfo:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/ContactInfo'
    ContactRequest:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/ContactRequest'
    ContactResend:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/ContactResend'
    Identity:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/Identity'
    LoginInput:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/LoginInput'
    Problem:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/Problem'
    Registration:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/Registration'
    RegistrationInput:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/RegistrationInput'
    RefreshSessionInput:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/RefreshSessionInput'
    Session:
      $ref: '../user-api/user-api-openapi.yml#/components/schemas/Session'
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          required:
            - mysql
            - redis
            - queue
            - objectStore
          properties:
            mysql:
              type: string
              enum: [ready, unavailable]
            redis:
              type: string
              enum: [ready, unavailable]
            queue:
              type: string
              enum: [ready, unavailable]
            objectStore:
              type: string
              enum: [ready, unavailable]
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: Backendbase-Api-Key
tags:
  - name: Authentication
    description: User registration, contact ownership, and password login.
  - name: Identity
    description: Current User identity, access tokens, sessions, and account closure.
  - name: System
    description: API metadata, liveness, and dependency readiness.
  - name: Example
    description: Example catalog groups and entries.
