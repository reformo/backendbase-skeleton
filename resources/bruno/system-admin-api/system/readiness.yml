info:
  name: Readiness
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/_status/ready'
  headers:
    -
      name: X-Source-Id
      value: system-admin
runtime:
  scripts:
    -
      type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.be.oneOf([200, 503]);
          const body = res.getBody();
          expect(body).to.have.property("checks");
          expect(body.checks).to.be.an("object");
          expect(body.status).to.equal(res.status === 200 ? "ready" : "unavailable");
          expect(body).not.to.have.property("data");
          expect(body).not.to.have.property("statusCode");
        });
