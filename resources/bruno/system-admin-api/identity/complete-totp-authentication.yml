info:
  name: 'Complete TOTP authentication'
  type: http
  seq: 15
http:
  method: POST
  url: '{{baseUrl}}/auth/login/complete'
  headers:
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "challengeId": "{{challengeId}}",
        "code": "{{code}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("session");
        expect(body).not.to.have.property("data");
        expect(body.session.tokenType).to.equal("Bearer");
        expect(body.session.accessToken).to.be.a("string");
        bru.setVar("accessToken", body.session.accessToken);
