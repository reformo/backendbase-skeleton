info:
  name: 'Revoke current access token'
  type: http
  seq: 17
http:
  method: DELETE
  url: '{{baseUrl}}/identity/token'
  headers:
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("token");
        expect(body).not.to.have.property("data");
