info:
  name: 'Resend Authenticated Contact Verification'
  type: http
  seq: 15
http:
  method: POST
  url: '{{baseUrl}}/identity/contact-verifications/{{contactInfoId}}/resend'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    - name: X-Source-Id
      value: system-admin
    - name: Accept-Language
      value: en-US
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: 'Bearer {{accessToken}}'
  body:
    type: json
    data: |-
      {
        "verificationContextToken": "{{verificationContextToken}}"
      }
runtime:
  scripts:
    - type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(200);
          const body = res.getBody();
          expect(body).to.have.property("contactInfo");
          expect(body).not.to.have.property("data");
          expect(body).not.to.have.property("statusCode");
          expect(body.contactInfo.contactInfoId).to.match(/^[0-9a-f-]{36}$/);
          expect(body.contactInfo).not.to.have.property("code");
          bru.setVar("contactInfoId", body.contactInfo.contactInfoId);
          if (body.contactInfo.verifiedAt) {
            bru.setVar(body.contactInfo.contactType + "ContactInfoId", body.contactInfo.contactInfoId);
          }
        });
