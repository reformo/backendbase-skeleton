info:
  name: 'Approve Admin'
  type: http
  seq: 21
http:
  method: POST
  url: '{{baseUrl}}/administration/admins/approve'
  headers:
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "actorId": "{{targetActorId}}",
        "evidence": "{{approvalEvidence}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("admin");
        expect(body).not.to.have.property("data");
