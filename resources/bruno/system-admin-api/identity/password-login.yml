info:
  name: 'Password login'
  type: http
  seq: 14
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "identifier": "{{identifier}}",
        "password": "{{password}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(200);
          const body = res.getBody();
          expect(body).not.to.have.property("statusCode");
          expect(body).to.have.property("session");
          expect(body).not.to.have.property("data");
          expect(body.session.tokenType).to.equal("Bearer");
          expect(body.session.accessToken).to.be.a("string");
          bru.setVar("accessToken", body.session.accessToken);
          expect(body.session.refreshToken).to.be.a("string");
          expect(body.session.sessionIdleExpiresAt).to.be.a("string");
          expect(body.session.sessionExpiresAt).to.be.a("string");
          bru.setVar("refreshToken", body.session.refreshToken);
        });
