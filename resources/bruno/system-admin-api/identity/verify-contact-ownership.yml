info:
  name: 'Verify contact ownership'
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/auth/ownership/verify'
  headers:
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "challengeId": "{{challengeId}}",
        "code": "{{code}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("ownershipVerification");
        expect(body).not.to.have.property("data");
