info:
  name: 'Read actor history'
  type: http
  seq: 23
http:
  method: GET
  url: '{{baseUrl}}/administration/actors/{{targetRealm}}/{{targetActorId}}'
  headers:
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("actor");
        expect(body).not.to.have.property("data");
        expect(body.actor.email).to.be.a("string");
        expect(body.actor.mobile).to.match(/^\+[1-9][0-9]{1,14}$/);
        expect(body.actor).not.to.have.property("loginName");
        expect(body.actor).to.have.property("firstName");
        expect(body.actor).to.have.property("lastName");
