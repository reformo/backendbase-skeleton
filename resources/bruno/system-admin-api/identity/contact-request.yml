info:
  name: 'Request Contact Verification'
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/auth/contact-verifications'
  headers:
    - name: X-Source-Id
      value: system-admin
    - name: Accept-Language
      value: en-US
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "verificationContextToken": "{{verificationContextToken}}",
        "contactType": "{{contactType}}",
        "identifier": "{{identifier}}",
        "password": "{{password}}"
      }
runtime:
  scripts:
    - type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).to.have.property("contactInfo");
        expect(body).not.to.have.property("data");
        expect(body).not.to.have.property("statusCode");
        expect(body.contactInfo.contactInfoId).to.match(/^[0-9a-f-]{36}$/);
        expect(body.contactInfo).not.to.have.property("code");
        bru.setVar("contactInfoId", body.contactInfo.contactInfoId);
        if (body.contactInfo.verifiedAt) {
          bru.setVar(body.contactInfo.contactType + "ContactInfoId", body.contactInfo.contactInfoId);
        }
