info:
  name: 'Resend contact ownership proof'
  type: http
  seq: 11
http:
  method: POST
  url: '{{baseUrl}}/auth/ownership/resend'
  headers:
    -
      name: X-Source-Id
      value: system-admin
    -
      name: Accept-Language
      value: en-US
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "loginName": "{{loginName}}",
        "password": "{{password}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("challenge");
        expect(body).not.to.have.property("data");
        expect(body.challenge.challengeId).to.match(/^[0-9a-f-]{36}$/);
        bru.setVar("challengeId", body.challenge.challengeId);
