info:
  name: Liveness
  type: http
  seq: 1
http:
  method: GET
  url: '{{baseUrl}}/_status'
  headers:
    -
      name: X-Source-Id
      value: user
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        expect(res.getBody().status).to.equal("alive");
