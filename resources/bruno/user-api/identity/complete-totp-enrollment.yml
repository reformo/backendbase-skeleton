info:
  name: 'Complete TOTP enrollment'
  type: http
  seq: 14
http:
  method: POST
  url: '{{baseUrl}}/auth/mfa/enrollment/complete'
  headers:
    -
      name: X-Source-Id
      value: user
    -
      name: Accept-Language
      value: en-US
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "challengeId": "{{challengeId}}",
        "code": "{{code}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("enrollment");
        expect(body).not.to.have.property("data");
