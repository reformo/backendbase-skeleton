info:
  name: 'Revoke current access token'
  type: http
  seq: 18
http:
  method: DELETE
  url: '{{baseUrl}}/identity/token'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    -
      name: X-Source-Id
      value: user
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
runtime:
  scripts:
    -
      type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(200);
          const body = res.getBody();
          expect(body).not.to.have.property("statusCode");
          expect(body).to.have.property("token");
          expect(body).not.to.have.property("data");
        });
