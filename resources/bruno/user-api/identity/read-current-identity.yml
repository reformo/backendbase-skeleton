info:
  name: 'Read current identity'
  type: http
  seq: 17
http:
  method: GET
  url: '{{baseUrl}}/identity'
  headers:
    -
      name: X-Source-Id
      value: user
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("user");
        expect(body).not.to.have.property("data");
