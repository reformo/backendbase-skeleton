# Uses the default registration policy: verified mobile, optional verified email.
# Verify each contact required by the target deployment with the same context token.
# If neither proof is required, omit verificationContextToken or set it to null.
info:
  name: 'Register User'
  type: http
  seq: 10
http:
  method: POST
  url: '{{baseUrl}}/auth/register'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    -
      name: X-Source-Id
      value: user
    -
      name: Accept-Language
      value: en-US
    -
      name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "{{firstName}}",
        "lastName": "{{lastName}}",
        "email": "{{email}}",
        "mobile": "{{mobile}}",
        "password": "{{password}}",
        "verificationContextToken": "{{verificationContextToken}}"
      }
runtime:
  scripts:
    -
      type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(201);
          const body = res.getBody();
          expect(body).not.to.have.property("statusCode");
          expect(body).to.have.property("registration");
          expect(body).not.to.have.property("data");
          expect(body.registration.accountId).to.match(/^[0-9a-f-]{36}$/);
          bru.setVar("accountId", body.registration.accountId);
        });
