info:
  name: 'End current session'
  type: http
  seq: 19
http:
  method: DELETE
  url: '{{baseUrl}}/identity/session'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    -
      name: X-Source-Id
      value: user
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
runtime:
  scripts:
    -
      type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).not.to.have.property("statusCode");
        expect(body).to.have.property("session");
        expect(body).not.to.have.property("data");
