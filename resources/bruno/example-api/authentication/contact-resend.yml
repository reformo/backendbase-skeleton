info:
  name: 'Resend Contact Verification'
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/auth/contact-verifications/{{contactInfoId}}/resend'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    - name: Backendbase-Api-Key
      value: '{{apiKey}}'
    - name: X-Source-Id
      value: example
    - name: Accept-Language
      value: en-US
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "verificationContextToken": "{{verificationContextToken}}"
      }
runtime:
  scripts:
    - type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(200);
          const body = res.getBody();
          expect(body).to.have.property("contactInfo");
          expect(body).not.to.have.property("data");
          expect(body).not.to.have.property("statusCode");
          expect(body.contactInfo.contactInfoId).to.match(/^[0-9a-f-]{36}$/);
          expect(body.contactInfo).not.to.have.property("code");
          bru.setVar("contactInfoId", body.contactInfo.contactInfoId);
        });
