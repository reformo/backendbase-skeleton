info:
  name: 'Close Account'
  type: http
  seq: 20
http:
  method: DELETE
  url: '{{baseUrl}}/identity/account'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    - name: Backendbase-Api-Key
      value: '{{apiKey}}'
    -
      name: X-Source-Id
      value: example
    -
      name: Accept-Language
      value: en-US
    -
      name: Authorization
      value: 'Bearer {{accessToken}}'
runtime:
  scripts:
    -
      type: tests
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(200);
          const body = res.getBody();
          expect(body).not.to.have.property("statusCode");
          expect(body).to.have.property("account");
          expect(body).not.to.have.property("data");
        });
