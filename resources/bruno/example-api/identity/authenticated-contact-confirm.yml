info:
  name: 'Confirm Authenticated Contact Verification'
  type: http
  seq: 14
http:
  method: POST
  url: '{{baseUrl}}/identity/contact-verifications/{{contactInfoId}}/confirm'
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
    - name: Backendbase-Api-Key
      value: '{{apiKey}}'
    - name: X-Source-Id
      value: example
    - name: Accept-Language
      value: en-US
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: 'Bearer {{accessToken}}'
  body:
    type: json
    data: |-
      {
        "verificationContextToken": "{{verificationContextToken}}",
        "code": "{{code}}"
      }
runtime:
  scripts:
    - type: tests
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body).to.have.property("contactInfo");
        expect(body).not.to.have.property("data");
        expect(body).not.to.have.property("statusCode");
        expect(body.contactInfo.contactInfoId).to.match(/^[0-9a-f-]{36}$/);
        expect(body.contactInfo).not.to.have.property("code");
        bru.setVar("contactInfoId", body.contactInfo.contactInfoId);
