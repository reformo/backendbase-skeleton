info:
  name: "List Accounts"
  type: "http"
  seq: 21

http:
  method: "GET"
  url: "{{baseUrl}}/accounts"
  headers:
    - name: "Backendbase-Api-Key"
      value: "{{apiKey}}"
    - name: "Accept-Language"
      value: "{{acceptLanguage}}"
    - name: "The-Timezone-IANA"
      value: "{{timezone}}"
    - name: "X-Request-Id"
      value: "{{requestId}}"
    - name: "X-Source-Id"
      value: "{{sourceId}}"
    - name: "Authorization"
      value: "Bearer {{accessToken}}"

runtime:
  scripts:
    - type: "tests"
      code: |
        expect(res.status).to.equal(200);
        expect(res.getBody().accounts).to.be.an("array");
