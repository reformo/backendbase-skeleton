info:
  name: "Liveness Check"
  type: "http"
  seq: 2

http:
  method: "GET"
  url: "{{baseUrl}}/_status"
  headers:
    - name: "Accept-Language"
      value: "{{acceptLanguage}}"
    - name: "The-Timezone-IANA"
      value: "{{timezone}}"
    - name: "X-Request-Id"
      value: "{{requestId}}"
    - name: "X-Source-Id"
      value: "{{sourceId}}"

runtime:
  scripts:
    - type: "tests"
      code: |
        expect(res.status).to.equal(200);
        expect(res.getBody()).to.deep.equal({ status: "alive" });
