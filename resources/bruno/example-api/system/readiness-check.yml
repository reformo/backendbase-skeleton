info:
  name: "Readiness Check"
  type: "http"
  seq: 3

http:
  method: "GET"
  url: "{{baseUrl}}/_status/ready"
  headers:
    - name: "Accept-Language"
      value: "{{acceptLanguage}}"
    - name: "The-Timezone-IANA"
      value: "{{timezone}}"
    - name: "X-Request-Id"
      value: "{{requestId}}"
    - name: "X-Source-Id"
      value: "{{sourceId}}"

runtime:
  scripts:
    - type: "tests"
      code: |
        expect(res.status).to.be.oneOf([200, 503]);
        const body = res.getBody();
        expect(body.status).to.be.oneOf(["ready", "unavailable"]);
        expect(body.checks).to.have.property("mysql");
        expect(body.checks).to.have.property("redis");
        expect(body.checks).to.have.property("queue");
        expect(body.checks).to.have.property("objectStore");
