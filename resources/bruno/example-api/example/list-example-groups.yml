info:
  name: "List Example Groups"
  type: "http"
  seq: 40

http:
  method: "GET"
  url: "{{baseUrl}}/example-types/{{type-slug}}/groups"
  headers:
    - name: "Backendbase-Api-Key"
      value: "{{apiKey}}"
    - name: "Accept-Language"
      value: "{{acceptLanguage}}"
    - name: "The-Timezone-IANA"
      value: "{{timezone}}"
    - name: "X-Request-Id"
      value: "{{requestId}}"
    - name: "X-Source-Id"
      value: "{{sourceId}}"
  params:
    - name: "typeTargetId"
      value: "{{typeTargetId}}"
      type: "query"
    - name: "pageSize"
      value: "1000"
      type: "query"
    - name: "page"
      value: "1"
      type: "query"

runtime:
  scripts:
    - type: "before-request"
      code: |
        if (!bru.hasVar("example-key")) {
          const suffix = Math.random().toString(36).slice(2, 10);
          bru.setVar("example-key", `bruno-${Date.now()}-${suffix}`);
        }
    - type: "tests"
      code: |
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body.pageSize).to.equal(1000);
        expect(body.page).to.equal(1);
        expect(body).to.have.property("total");
        expect(body.exampleGroups).to.be.an("array");
