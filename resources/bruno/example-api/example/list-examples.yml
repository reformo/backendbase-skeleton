info:
  name: "List Examples"
  type: "http"
  seq: 42

http:
  method: "GET"
  url: "{{baseUrl}}/example-types/{{type-slug}}/groups/{{example-group}}/examples"
  headers:
    - name: "Authorization"
      value: "Bearer {{accessToken}}"
    - name: "Backendbase-Api-Key"
      value: "{{apiKey}}"
    - name: "Accept-Language"
      value: "{{acceptLanguage}}"
    - name: "The-Timezone-IANA"
      value: "{{timezone}}"
    - name: "X-Request-Id"
      value: "{{requestId}}"
    - name: "X-Source-Id"
      value: "{{sourceId}}"
  params:
    - name: "typeTargetId"
      value: "{{typeTargetId}}"
      type: "query"
    - name: "pageSize"
      value: "1000"
      type: "query"
    - name: "page"
      value: "1"
      type: "query"

runtime:
  scripts:
    - type: "tests"
      code: |
        test("Response matches the API contract", function () {
          expect(res.status).to.equal(200);
          const body = res.getBody();
          expect(body).not.to.have.property("data");
          expect(body).not.to.have.property("statusCode");
          expect(body.pageSize).to.equal(1000);
          expect(body.page).to.equal(1);
          expect(body).to.have.property("total");
          expect(body.examples).to.be.an("array");
          expect(body.total).to.be.a("number").and.to.be.at.least(body.examples.length);
          expect(body.examples.length).to.be.at.most(body.pageSize);
          if (body.examples.length > 0) {
            expect(body.examples[0]).to.have.property("uuid");
            expect(body.examples[0]).to.have.property("lookupKey");
            expect(body.examples[0]).to.have.property("lookupValue");
            expect(body.examples[0]).to.have.property("details");
            expect(body.examples[0].details).to.be.an("object");
            expect(body.examples[0]).to.have.property("createdAt");
          }
          const created = body.examples.find(entry => entry.lookupKey === bru.getVar("example-key"));
          expect(created).to.exist;
          expect(created.details.label).to.equal("A & B <tag>");
          expect(created.details.heroImage).to.deep.equal({path: "hero.png"});
          expect(created.details).not.to.have.property("heroImageUrl");
        });
