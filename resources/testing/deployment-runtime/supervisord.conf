[supervisord]
nodaemon=true
logfile=/run/rehearsal/supervisor.log
pidfile=/run/rehearsal/supervisor.pid
childlogdir=/run/rehearsal
[unix_http_server]
file=/run/rehearsal/supervisor.sock
chmod=0700
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/rehearsal/supervisor.sock
[program:fpm]
command=/fixture/process.sh fpm
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/run/rehearsal/fpm-output.log
stderr_logfile=/run/rehearsal/fpm-error.log
[program:consumer]
command=/fixture/process.sh consumer
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/run/rehearsal/consumer.log
stderr_logfile=/run/rehearsal/consumer-error.log
[program:relay]
command=/fixture/process.sh relay
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/run/rehearsal/relay.log
stderr_logfile=/run/rehearsal/relay-error.log
