[global]
pid=/run/rehearsal/php-fpm.pid
error_log=/run/rehearsal/php-fpm.log
daemonize=no
[application]
user=www-data
group=www-data
listen=0.0.0.0:9000
pm=dynamic
pm.max_children=8
pm.start_servers=2
pm.min_spare_servers=2
pm.max_spare_servers=4
clear_env=no
catch_workers_output=yes
security.limit_extensions=.php
