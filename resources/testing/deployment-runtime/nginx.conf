events { worker_connections 1024; }
http {
    include /etc/nginx/backendbase/http-rate-limit.conf;
    access_log off;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        root /srv/backendbase/webroot/api/public;
        include /etc/nginx/backendbase/api-rate-limit.conf;
        location / {
            if (-f /srv/backendbase/shared/maintenance) { return 503; }
            include /fixture/fastcgi-params.conf;
            fastcgi_param SCRIPT_FILENAME /srv/backendbase/webroot/api/public/index.php;
            fastcgi_param HTTP_X_SOURCE_ID $source_id;
            fastcgi_pass application:9000;
        }
        location = /internal-ready {
            set $apiClientRateKey "";
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
            fastcgi_param QUERY_STRING "";
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param SERVER_PROTOCOL HTTP/1.1;
            fastcgi_param SERVER_NAME localhost;
            fastcgi_param SERVER_PORT 8080;
            fastcgi_param SCRIPT_NAME /user-api/index.php;
            fastcgi_param SCRIPT_FILENAME /srv/backendbase/webroot/api/public/index.php;
            fastcgi_param REQUEST_URI /user-api/_status/ready;
            fastcgi_param HTTP_X_SOURCE_ID user;
            fastcgi_pass application:9000;
        }
    }
    map $uri $source_id {
        ~^/example-api/ example;
        ~^/user-api/ user;
        ~^/system-admin-api/ system-admin;
        default unknown;
    }
}
