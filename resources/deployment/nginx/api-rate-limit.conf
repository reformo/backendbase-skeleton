# Include inside each API server {}. Keep application 429 responses intact.
limit_req zone=api-client-requests burst=60 nodelay;
limit_req_status 429;
limit_req_log_level warn;
fastcgi_intercept_errors off;
proxy_intercept_errors off;

error_page 429 = @api-rate-limit;

location @api-rate-limit {
    default_type application/problem+json;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    return 429 '{"type":"about:blank","code":"system/rate-limit-exceeded","title":"Too Many Requests","status":429,"detail":"The API request limit was reached."}';
}
