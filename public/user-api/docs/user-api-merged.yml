              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Identity conflict'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'Authentication dependency unavailable'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerToken: []
  /_status:
    get:
      tags:
        - System
      summary: 'Liveness check'
      operationId: userLiveness
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            enum:
              - user
            type: string
      responses:
        '200':
          description: Available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
      security: []
  /_status/ready:
    get:
      tags:
        - System
      summary: 'Readiness check'
      operationId: userReadiness
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            enum:
              - user
            type: string
      responses:
        '200':
          description: Available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
      security: []
components:
  schemas:
    RegistrationInput:
      required:
        - email
        - loginName
        - password
      type: object
      properties:
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        loginName:
          maxLength: 64
          minLength: 3
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          type: string
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    LoginInput:
      required:
        - loginName
        - password
      type: object
      properties:
        loginName:
          maxLength: 64
          minLength: 3
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          type: string
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    ProofInput:
      required:
        - challengeId
        - code
      type: object
      properties:
        challengeId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        code:
          pattern: '^[0-9]{6}$'
          type: string
      additionalProperties: false
    Challenge:
      required:
        - challengeId
        - expiresIn
      type: object
      properties:
        challengeId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        expiresIn:
          enum:
            - 300
          type: integer
      additionalProperties: false
    Registration:
      required:
        - accountId
        - actorId
        - challengeId
        - expiresIn
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        challengeId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        expiresIn:
          enum:
            - 300
          type: integer
      additionalProperties: false
    Enrollment:
      required:
        - challengeId
        - totpSecret
        - otpauthUri
        - expiresIn
      type: object
      properties:
        challengeId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        totpSecret:
          pattern: '^[A-Z2-7]{32}$'
          type: string
        otpauthUri:
          type: string
        expiresIn:
          enum:
            - 300
          type: integer
      additionalProperties: false
    Completed:
      required:
        - completed
      type: object
      properties:
        completed:
          enum:
            - true
          type: boolean
      additionalProperties: false
    Session:
      required:
        - accessToken
        - tokenType
        - expiresAt
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          enum:
            - Bearer
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Identity:
      required:
        - accountId
        - actorId
        - realm
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
      additionalProperties: false
    AdminInvitationInput:
      required:
        - accountId
        - loginName
        - evidence
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        loginName:
          maxLength: 64
          minLength: 3
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          type: string
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        evidence:
          maxLength: 160
          minLength: 1
          type: string
      additionalProperties: false
    AdminApprovalInput:
      required:
        - actorId
        - evidence
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        evidence:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Must differ from the invitation evidence. Self-approval is forbidden.'
      additionalProperties: false
    ActorChangeInput:
      required:
        - actorId
        - realm
        - action
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
        action:
          enum:
            - remove
            - restore
          type: string
      additionalProperties: false
    AdminInvitation:
      required:
        - actorId
        - approved
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        approved:
          enum:
            - false
          type: boolean
      additionalProperties: false
    ActorHistory:
      required:
        - actorId
        - accountId
        - realm
        - loginName
        - approved
        - createdAt
        - deletedAt
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
        loginName:
          maxLength: 64
          minLength: 3
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          type: string
          description: 'ASCII names are normalized to lowercase. Uniqueness is local to the realm.'
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    Problem:
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Liveness:
      required:
        - status
      type: object
      properties:
        status:
          enum:
            - alive
          type: string
      additionalProperties: false
    Readiness:
      required:
        - status
        - checks
      type: object
      properties:
        status:
          enum:
            - ready
            - unavailable
          type: string
        checks:
          type: object
          additionalProperties:
            enum:
              - ready
              - unavailable
            type: string
      additionalProperties: false
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  -
    name: Authentication
    description: 'Registration, contact ownership, enrollment, and login.'
  -
    name: Identity
    description: 'Current identity, access tokens, sessions, and account closure.'
  -
    name: System
    description: 'API liveness and dependency readiness.'
