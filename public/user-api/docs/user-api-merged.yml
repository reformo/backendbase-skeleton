openapi: 3.0.0
info:
  title: 'Backendbase USER API'
  description: 'Realm-specific password and TOTP authentication. Contact ownership verification is a separate gate. Admin enrollment also requires invitation and approval.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8080/user-api'
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: 'Register User'
      operationId: userRegisterUser
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            enum:
              - user
            type: string
      requestBody:
        description: 'Strict JSON object. Unknown fields and type coercion are rejected. The raw body limit is 65536 bytes before parsing.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
        required: true
      responses:
        '201':
          description: 'Completed operation'
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
          content:
            application/json:
              schema:
                required:
                  - statusCode
                  - data
                type: object
                properties:
                  statusCode:
                    enum:
                      - 201
                    type: integer
                  data:
                    $ref: '#/components/schemas/Registration'
                additionalProperties: false
        '400':
          description: 'Invalid request'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'Authentication denied'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Identity conflict'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'Authentication dependency unavailable'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
