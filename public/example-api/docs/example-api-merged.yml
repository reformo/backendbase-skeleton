openapi: 3.0.0
info:
  title: 'Backendbase EXAMPLE API Documentation'
  description: 'All Backendbase EXAMPLE API endpoints are presented here.'
  contact:
    email: mehmet.korkmaz@reformo.net
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8080/example-api'
    description: 'EXAMPLE API Development URL'
  -
    url: 'https://example.api-stage.backendbaseapp.com'
    description: 'EXAMPLE API Stage URL'
  -
    url: 'https://example.api.backendbaseapp.com'
    description: 'EXAMPLE API Production URL'
paths:
  /:
    get:
      tags:
        - System
      description: 'Read API build metadata'
      operationId: apiMetadata
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          description: 'Source Id for request'
          required: true
          schema:
            enum:
              - public
              - private
              - example
            type: string
            default: example
          example: example
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                  - apiMetadata
                type: object
                properties:
                  apiMetadata:
                    required:
                      - version
                      - buildId
                      - cdnBaseUrl
                    type: object
                    properties:
                      version:
                        type: string
                        example: 1.0.0
                      buildId:
                        type: string
                        example: 0.0.1
                      cdnBaseUrl:
                        type: string
                        example: ''
                    additionalProperties: false
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                required:
                  - type
                  - code
                  - title
                  - status
                  - detail
                type: object
                properties:
                  type:
                    type: string
                    description: "An absolute URI that identifies the problem type.  When dereferenced,\nit SHOULD provide human-readable documentation for the problem type\n(e.g., using HTML).\n"
                    format: uri
                    default: 'about:blank'
                    example: 'https://zalando.github.io/problem/constraint-violation'
                  code:
                    type: string
                    description: "Unique string value within the project that can be used to issue's id\n"
                    example: identity-access/restricted
                  title:
                    type: string
                    description: "A short, summary of the problem type. Written in english and readable\nfor engineers (usually not suited for non technical stakeholders and\nnot localized); example: Service Unavailable\n"
                  status:
                    maximum: 600
                    minimum: 100
                    type: integer
                    description: "The HTTP status code generated by the origin server for this occurrence\nof the problem.\n"
                    format: int32
                    example: 503
                    exclusiveMaximum: true
                  detail:
                    type: string
                    description: "A human readable explanation specific to this occurrence of the\nproblem.\n"
                    example: 'Connection to database timed out'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                required:
                  - type
                  - code
                  - title
                  - status
                  - detail
                type: object
                properties:
                  type:
                    type: string
                    description: "An absolute URI that identifies the problem type.  When dereferenced,\nit SHOULD provide human-readable documentation for the problem type\n(e.g., using HTML).\n"
                    format: uri
                    default: 'about:blank'
                    example: 'https://zalando.github.io/problem/constraint-violation'
                  code:
                    type: string
                    description: "Unique string value within the project that can be used to issue's id\n"
                    example: identity-access/restricted
                  title:
                    type: string
                    description: "A short, summary of the problem type. Written in english and readable\nfor engineers (usually not suited for non technical stakeholders and\nnot localized); example: Service Unavailable\n"
                  status:
                    maximum: 600
                    minimum: 100
                    type: integer
                    description: "The HTTP status code generated by the origin server for this occurrence\nof the problem.\n"
                    format: int32
                    example: 503
                    exclusiveMaximum: true
                  detail:
                    type: string
                    description: "A human readable explanation specific to this occurrence of the\nproblem.\n"
                    example: 'Connection to database timed out'
      security:
        -
          apiKey: []
  /_status:
    get:
      tags:
        - System
      description: 'Check whether the API process can serve requests'
      operationId: livenessCheck
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          description: 'Source Id for request'
          required: true
          schema:
            enum:
              - public
              - private
              - example
            type: string
            default: example
          example: example
      responses:
        '200':
          description: 'Process is alive'
          content:
            application/json:
              schema:
                required:
                  - status
                type: object
                properties:
                  status:
                    enum:
                      - alive
                    type: string
                additionalProperties: false
      security: []
  /_status/ready:
    get:
      tags:
        - System
      description: 'Check bounded connections to required dependencies'
      operationId: readinessCheck
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          description: 'Source Id for request'
          required: true
          schema:
            enum:
              - public
              - private
              - example
            type: string
            default: example
          example: example
      responses:
        '200':
          description: 'All dependencies are ready'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: 'One or more dependencies are unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
      security: []
