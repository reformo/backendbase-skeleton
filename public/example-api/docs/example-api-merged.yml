components:
  schemas:
    Readiness:
      required:
        - status
        - checks
      type: object
      properties:
        status:
          enum:
            - ready
            - unavailable
          type: string
        checks:
          required:
            - mysql
            - redis
            - queue
            - objectStore
          type: object
          properties:
            mysql:
              enum:
                - ready
                - unavailable
              type: string
            redis:
              enum:
                - ready
                - unavailable
              type: string
            queue:
              enum:
                - ready
                - unavailable
              type: string
            objectStore:
              enum:
                - ready
                - unavailable
              type: string
  securitySchemes:
    bearerAuth:
      type: http
      description: 'JWT Authorization header using the Bearer scheme.'
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      name: Backendbase-Api-Key
      in: header
tags:
  -
    name: System
  -
    name: 'Identity & Access'
  -
    name: Example
