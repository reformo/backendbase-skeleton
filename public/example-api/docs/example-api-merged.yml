openapi: 3.0.0
info:
  title: 'Backendbase EXAMPLE API Documentation'
  description: 'All Backendbase EXAMPLE API endpoints are presented here.'
  contact:
    email: mehmet.korkmaz@reformo.net
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8080/example-api'
    description: 'EXAMPLE API Development URL'
  -
    url: 'https://example.api-stage.backendbaseapp.com'
    description: 'EXAMPLE API Stage URL'
  -
    url: 'https://example.api.backendbaseapp.com'
    description: 'EXAMPLE API Production URL'
paths:
  '/auth/contact-verifications/{contact-info-id}/resend':
    post:
      tags:
        - Authentication
      summary: 'Resend contact verification'
      description: 'Codes expire after five minutes. User registration requires mobile verification less than 12 hours ago. Email verification is optional before registration and available after login. Admin verification is optional and preserves existing access.'
      operationId: exampleContactResend
      parameters:
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            enum:
              - example
            type: string
        -
          name: contact-info-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactResend'
        required: true
      responses:
        '200':
          description: 'Contact verification state'
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
          content:
            application/json:
              schema:
                required:
                  - contactInfo
                type: object
                properties:
                  contactInfo:
                    $ref: '#/components/schemas/ContactInfo'
                additionalProperties: false
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'Verification denied'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Access denied'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Verification conflict'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 'Verification expired'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Verification limit reached'
          headers:
            Retry-After:
              schema:
                minimum: 1
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'Verification dependency unavailable'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          apiKey: []
