components:
  schemas:
    AuthenticatedContactRequest:
      required:
        - contactType
        - verificationContextToken
      type: object
      properties:
        contactType:
          enum:
            - email
          type: string
        verificationContextToken:
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
          description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
          writeOnly: true
      additionalProperties: false
    Completed:
      required:
        - completed
      type: object
      properties:
        completed:
          enum:
            - true
          type: boolean
      additionalProperties: false
    ContactConfirmation:
      required:
        - verificationContextToken
        - code
      type: object
      properties:
        verificationContextToken:
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
          description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
          writeOnly: true
        code:
          pattern: '^[0-9]{6}$'
          type: string
      additionalProperties: false
    ContactInfo:
      required:
        - contactInfoId
        - contactType
        - codeExpiresAt
        - resendAfter
        - verifiedAt
        - registrationValidUntil
        - deliveryState
      type: object
      properties:
        contactInfoId:
          type: string
          format: uuid
        contactType:
          enum:
            - email
            - mobile
          type: string
        codeExpiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        registrationValidUntil:
          type: string
          format: date-time
          nullable: true
        deliveryState:
          enum:
            - pending
            - accepted
            - unknown
          type: string
      additionalProperties: false
    ContactRequest:
      required:
        - contactType
        - contactValue
        - verificationContextToken
      type: object
      properties:
        contactType:
          enum:
            - email
            - mobile
          type: string
        contactValue:
          maxLength: 254
          type: string
          description: 'ASCII email or E.164 mobile, according to contactType.'
        verificationContextToken:
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
          description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
          writeOnly: true
      additionalProperties: false
    ContactResend:
      required:
        - verificationContextToken
      type: object
      properties:
        verificationContextToken:
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
          description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
          writeOnly: true
      additionalProperties: false
    Identity:
      required:
        - accountId
        - actorId
        - realm
        - email
        - mobile
        - firstName
        - lastName
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
      additionalProperties: false
    LoginInput:
      required:
        - identifier
        - password
      type: object
      properties:
        identifier:
          oneOf:
            -
              maxLength: 254
              pattern: '^[\x21-\x7e]+@[\x21-\x7e]+$'
              type: string
              format: email
            -
              maxLength: 16
              minLength: 3
              pattern: '^\+[1-9][0-9]{1,14}$'
              type: string
          description: 'Account email or E.164 mobile number.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    Problem:
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Registration:
      required:
        - accountId
        - actorId
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
      additionalProperties: false
    RegistrationInput:
      required:
        - email
        - mobile
        - password
        - verificationContextToken
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        verificationContextToken:
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
          description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
          writeOnly: true
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      description: 'Required email and mobile values. Only mobile verification is required before registration. Matching fresh email evidence is optional. Contact identifiers are rejected.'
      additionalProperties: false
    Session:
      required:
        - accessToken
        - tokenType
        - expiresAt
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          enum:
            - Bearer
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Readiness:
      required:
        - status
        - checks
      type: object
      properties:
        status:
          enum:
            - ready
            - unavailable
          type: string
        checks:
          required:
            - mysql
            - redis
            - queue
            - objectStore
          type: object
          properties:
            mysql:
              enum:
                - ready
                - unavailable
              type: string
            redis:
              enum:
                - ready
                - unavailable
              type: string
            queue:
              enum:
                - ready
                - unavailable
              type: string
            objectStore:
              enum:
                - ready
                - unavailable
              type: string
      additionalProperties: false
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      name: Backendbase-Api-Key
      in: header
tags:
  -
    name: Authentication
    description: 'User registration, contact ownership, and password login.'
  -
    name: Identity
    description: 'Current User identity, access tokens, sessions, and account closure.'
  -
    name: System
    description: 'API metadata, liveness, and dependency readiness.'
  -
    name: Example
    description: 'Example catalog groups and entries.'
