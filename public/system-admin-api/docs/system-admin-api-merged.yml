openapi: 3.0.0
info:
  title: 'Backendbase ADMIN API'
  description: 'Realm-specific password authentication. Contact ownership verification is a separate gate. Admin enrollment also requires invitation and approval.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8080/system-admin-api'
paths:
  '/identity/contact-verifications/{contact-info-id}/resend':
    post:
      tags:
        - Identity
      summary: 'Resend contact verification'
      description: 'Codes expire after five minutes. User registration requires mobile verification less than 12 hours ago. Email verification is optional before registration and available after login. Admin verification is optional and preserves existing access.'
      operationId: systemadminAuthenticatedContactResend
      parameters:
        -
          name: Idempotency-Key
          in: header
          description: 'Client-generated key for one intended write. Reuse the same key, credentials, URL, headers, and exact body on retry. Completed responses remain replayable for 24 hours. Concurrent or unresolved attempts return 409. Changed request content returns 422. X-Request-Id can change between attempts.'
          required: true
          schema:
            maxLength: 255
            minLength: 1
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$'
            type: string
          example: 019f6322-1234-7000-8000-000000000001
        -
          name: Accept-Language
          in: header
          description: 'selected language'
          required: false
          schema:
            type: string
            default: tr-TR
          example: tr-TR
        -
          name: The-Timezone-IANA
          in: header
          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            enum:
              - system-admin
            type: string
        -
          name: contact-info-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactResend'
        required: true
      responses:
        '422':
          description: 'Idempotency key reused with different request content'
          content:
            application/problem+json:
              schema:
                required:
                  - type
                  - code
                  - title
                  - status
                  - detail
                type: object
                properties:
                  type:
                    type: string
                    description: "An absolute URI that identifies the problem type.  When dereferenced,\nit SHOULD provide human-readable documentation for the problem type\n(e.g., using HTML).\n"
                    format: uri
                    default: 'about:blank'
                    example: 'https://zalando.github.io/problem/constraint-violation'
                  code:
                    type: string
                    description: "Unique string value within the project that can be used to issue's id\n"
                    example: identity-access/restricted
                  title:
                    type: string
                    description: "A short, summary of the problem type. Written in english and readable\nfor engineers (usually not suited for non technical stakeholders and\nnot localized); example: Service Unavailable\n"
                  status:
                    maximum: 600
                    minimum: 100
                    type: integer
                    description: "The HTTP status code generated by the origin server for this occurrence\nof the problem.\n"
                    format: int32
                    example: 503
                    exclusiveMaximum: true
                  detail:
                    type: string
                    description: "A human readable explanation specific to this occurrence of the\nproblem.\n"
                    example: 'Connection to database timed out'
        '500':
          description: 'Internal failure; the same key replays the recorded failure'
          content:
            application/problem+json:
              schema:
                required:
                  - type
                  - code
                  - title
                  - status
                  - detail
                type: object
                properties:
                  type:
                    type: string
                    description: "An absolute URI that identifies the problem type.  When dereferenced,\nit SHOULD provide human-readable documentation for the problem type\n(e.g., using HTML).\n"
                    format: uri
                    default: 'about:blank'
                    example: 'https://zalando.github.io/problem/constraint-violation'
                  code:
                    type: string
                    description: "Unique string value within the project that can be used to issue's id\n"
                    example: identity-access/restricted
                  title:
                    type: string
                    description: "A short, summary of the problem type. Written in english and readable\nfor engineers (usually not suited for non technical stakeholders and\nnot localized); example: Service Unavailable\n"
                  status:
                    maximum: 600
                    minimum: 100
                    type: integer
                    description: "The HTTP status code generated by the origin server for this occurrence\nof the problem.\n"
                    format: int32
                    example: 503
                    exclusiveMaximum: true
                  detail:
                    type: string
                    description: "A human readable explanation specific to this occurrence of the\nproblem.\n"
                    example: 'Connection to database timed out'
        '200':
          description: 'Contact verification state'
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
          content:
            application/json:
              schema:
                required:
                  - contactInfo
                type: object
                properties:
                  contactInfo:
                    $ref: '#/components/schemas/ContactInfo'
                additionalProperties: false
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 'Verification denied'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Access denied'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Verification conflict'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 'Verification expired'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Nginx request or application verification limit reached'
          headers:
            Retry-After:
              schema:
                minimum: 1
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'Verification dependency unavailable'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        -
          bearerToken: []
