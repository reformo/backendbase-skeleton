components:
  schemas:
    RegistrationInput:
      required:
        - email
        - mobile
        - password
        - verificationContextToken
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    LoginInput:
      required:
        - identifier
        - password
      type: object
      properties:
        identifier:
          oneOf:
            -
              maxLength: 254
              pattern: '^[\x21-\x7e]+@[\x21-\x7e]+$'
              type: string
              format: email
            -
              maxLength: 16
              minLength: 3
              pattern: '^\+[1-9][0-9]{1,14}$'
              type: string
          description: 'Account email or E.164 mobile number.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    Registration:
      required:
        - accountId
        - actorId
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
      additionalProperties: false
    VerificationContextToken:
      maxLength: 43
      minLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      type: string
      description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
      writeOnly: true
    ContactRequest:
      required:
        - contactType
        - contactValue
        - verificationContextToken
      type: object
      properties:
        contactType:
          enum:
            - email
            - mobile
          type: string
        contactValue:
          maxLength: 254
          type: string
          description: 'ASCII email or E.164 mobile, according to contactType.'
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    AdminContactRequest:
      required:
        - identifier
        - password
        - contactType
        - verificationContextToken
      type: object
      properties:
        identifier:
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 12
          type: string
          format: password
        contactType:
          enum:
            - email
            - mobile
          type: string
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    AuthenticatedContactRequest:
      required:
        - contactType
        - verificationContextToken
      type: object
      properties:
        contactType:
          enum:
            - email
            - mobile
          type: string
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    ContactConfirmation:
      required:
        - verificationContextToken
        - code
      type: object
      properties:
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
        code:
          pattern: '^[0-9]{6}$'
          type: string
      additionalProperties: false
    ContactResend:
      required:
        - verificationContextToken
      type: object
      properties:
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    ContactInfo:
      required:
        - contactInfoId
        - contactType
        - codeExpiresAt
        - resendAfter
        - verifiedAt
        - registrationValidUntil
        - deliveryState
      type: object
      properties:
        contactInfoId:
          type: string
          format: uuid
        contactType:
          enum:
            - email
            - mobile
          type: string
        codeExpiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        registrationValidUntil:
          type: string
          format: date-time
          nullable: true
        deliveryState:
          enum:
            - pending
            - accepted
            - unknown
          type: string
      additionalProperties: false
    Completed:
      required:
        - completed
      type: object
      properties:
        completed:
          enum:
            - true
          type: boolean
      additionalProperties: false
    Session:
      required:
        - accessToken
        - tokenType
        - expiresAt
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          enum:
            - Bearer
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Identity:
      required:
        - accountId
        - actorId
        - realm
        - email
        - mobile
        - firstName
        - lastName
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
      additionalProperties: false
    AdminInvitationInput:
      required:
        - accountId
        - evidence
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        evidence:
          maxLength: 160
          minLength: 1
          type: string
      additionalProperties: false
    AdminApprovalInput:
      required:
        - actorId
        - evidence
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        evidence:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Must differ from the invitation evidence. Self-approval is forbidden.'
      additionalProperties: false
    ActorChangeInput:
      required:
        - actorId
        - realm
        - action
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
        action:
          enum:
            - remove
            - restore
          type: string
      additionalProperties: false
    AdminInvitation:
      required:
        - actorId
        - approved
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        approved:
          enum:
            - false
          type: boolean
      additionalProperties: false
    ActorHistory:
      required:
        - actorId
        - accountId
        - realm
        - email
        - mobile
        - firstName
        - lastName
        - approved
        - createdAt
        - deletedAt
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    Problem:
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Liveness:
      required:
        - status
      type: object
      properties:
        status:
          enum:
            - alive
          type: string
      additionalProperties: false
    Readiness:
      required:
        - status
        - checks
      type: object
      properties:
        status:
          enum:
            - ready
            - unavailable
          type: string
        checks:
          type: object
          additionalProperties:
            enum:
              - ready
              - unavailable
            type: string
      additionalProperties: false
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
