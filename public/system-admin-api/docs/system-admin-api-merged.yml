          description: "Client's timezone"
          required: false
          schema:
            type: string
            format: 'Timezone IANA name'
            default: Europe/Istanbul
          example: Europe/Istanbul
        -
          name: X-Request-Id
          in: header
          description: 'Trace Id for request'
          required: false
          schema:
            type: string
            format: uuid
            default: 019f0325-5940-7702-8488-3cfe56553586
          example: 019f0325-5940-7702-8488-3cfe56553586
        -
          name: X-Source-Id
          in: header
          required: true
          schema:
            enum:
              - system-admin
            type: string
      responses:
        '429':
          description: 'Nginx API request limit reached before application execution'
          headers:
            Retry-After:
              description: 'Wait at least this many seconds before retrying the unchanged request.'
              schema:
                minimum: 1
                type: integer
                example: 1
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
          content:
            application/problem+json:
              schema:
                required:
                  - type
                  - code
                  - title
                  - status
                  - detail
                type: object
                properties:
                  type:
                    type: string
                    description: "An absolute URI that identifies the problem type.  When dereferenced,\nit SHOULD provide human-readable documentation for the problem type\n(e.g., using HTML).\n"
                    format: uri
                    default: 'about:blank'
                    example: 'https://zalando.github.io/problem/constraint-violation'
                  code:
                    type: string
                    description: "Unique string value within the project that can be used to issue's id\n"
                    example: identity-access/restricted
                  title:
                    type: string
                    description: "A short, summary of the problem type. Written in english and readable\nfor engineers (usually not suited for non technical stakeholders and\nnot localized); example: Service Unavailable\n"
                  status:
                    maximum: 600
                    minimum: 100
                    type: integer
                    description: "The HTTP status code generated by the origin server for this occurrence\nof the problem.\n"
                    format: int32
                    example: 503
                    exclusiveMaximum: true
                  detail:
                    type: string
                    description: "A human readable explanation specific to this occurrence of the\nproblem.\n"
                    example: 'Connection to database timed out'
              example:
                type: 'about:blank'
                code: system/rate-limit-exceeded
                title: 'Too Many Requests'
                status: 429
                detail: 'The API request limit was reached.'
        '200':
          description: Available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
      security: []
components:
  schemas:
    RegistrationInput:
      required:
        - email
        - mobile
        - password
        - verificationContextToken
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    LoginInput:
      required:
        - identifier
        - password
      type: object
      properties:
        refreshTokenTransport:
          enum:
            - body
            - cookie
          type: string
          description: 'Use cookie for same-site browsers. An exact configured Origin is required. Use body for native clients.'
          default: body
        identifier:
          oneOf:
            -
              maxLength: 254
              pattern: '^[\x21-\x7e]+@[\x21-\x7e]+$'
              type: string
              format: email
            -
              maxLength: 16
              minLength: 3
              pattern: '^\+[1-9][0-9]{1,14}$'
              type: string
          description: 'Account email or E.164 mobile number.'
        password:
          maxLength: 128
          minLength: 12
          type: string
          description: 'UTF-8, at most 512 bytes, without null bytes.'
          format: password
      additionalProperties: false
    Registration:
      required:
        - accountId
        - actorId
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
      additionalProperties: false
    VerificationContextToken:
      maxLength: 43
      minLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      type: string
      description: 'Client-generated 32-byte random secret encoded as canonical unpadded base64url. Keep this token for both contacts.'
      writeOnly: true
    ContactRequest:
      required:
        - contactType
        - contactValue
        - verificationContextToken
      type: object
      properties:
        contactType:
          enum:
            - email
            - mobile
          type: string
        contactValue:
          maxLength: 254
          type: string
          description: 'ASCII email or E.164 mobile, according to contactType.'
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    AdminContactRequest:
      required:
        - identifier
        - password
        - contactType
        - verificationContextToken
      type: object
      properties:
        identifier:
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 12
          type: string
          format: password
        contactType:
          enum:
            - email
            - mobile
          type: string
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    AuthenticatedContactRequest:
      required:
        - contactType
        - verificationContextToken
      type: object
      properties:
        contactType:
          enum:
            - email
            - mobile
          type: string
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    ContactConfirmation:
      required:
        - verificationContextToken
        - code
      type: object
      properties:
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
        code:
          pattern: '^[0-9]{6}$'
          type: string
      additionalProperties: false
    ContactResend:
      required:
        - verificationContextToken
      type: object
      properties:
        verificationContextToken:
          $ref: '#/components/schemas/VerificationContextToken'
      additionalProperties: false
    ContactInfo:
      required:
        - contactInfoId
        - contactType
        - codeExpiresAt
        - resendAfter
        - verifiedAt
        - registrationValidUntil
        - deliveryState
      type: object
      properties:
        contactInfoId:
          type: string
          format: uuid
        contactType:
          enum:
            - email
            - mobile
          type: string
        codeExpiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        registrationValidUntil:
          type: string
          format: date-time
          nullable: true
        deliveryState:
          enum:
            - pending
            - accepted
            - unknown
          type: string
      additionalProperties: false
    Completed:
      required:
        - completed
      type: object
      properties:
        completed:
          enum:
            - true
          type: boolean
      additionalProperties: false
    RefreshSessionInput:
      oneOf:
        -
          required:
            - refreshToken
          type: object
          properties:
            refreshToken:
              maxLength: 117
              minLength: 117
              type: string
            refreshTokenTransport:
              enum:
                - body
              type: string
          additionalProperties: false
        -
          required:
            - refreshTokenTransport
          type: object
          properties:
            refreshTokenTransport:
              enum:
                - cookie
              type: string
              description: 'Send the realm refresh cookie and an exact configured Origin.'
          additionalProperties: false
    Session:
      required:
        - accessToken
        - tokenType
        - expiresAt
        - sessionIdleExpiresAt
        - sessionExpiresAt
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          maxLength: 117
          minLength: 117
          type: string
          description: 'Returned only for body transport. Store in operating system secure storage.'
        sessionIdleExpiresAt:
          type: string
          description: 'Idle deadline at issue time. Successful authenticated requests can extend this deadline.'
          format: date-time
        sessionExpiresAt:
          type: string
          description: 'Fixed maximum session deadline. Renewal cannot extend this deadline.'
          format: date-time
        tokenType:
          enum:
            - Bearer
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Identity:
      required:
        - accountId
        - actorId
        - realm
        - email
        - mobile
        - firstName
        - lastName
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
      additionalProperties: false
    AdminInvitationInput:
      required:
        - accountId
        - evidence
      type: object
      properties:
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        evidence:
          maxLength: 160
          minLength: 1
          type: string
      additionalProperties: false
    AdminApprovalInput:
      required:
        - actorId
        - evidence
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        evidence:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Must differ from the invitation evidence. Self-approval is forbidden.'
      additionalProperties: false
    ActorChangeInput:
      required:
        - actorId
        - realm
        - action
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
        action:
          enum:
            - remove
            - restore
          type: string
      additionalProperties: false
    AdminInvitation:
      required:
        - actorId
        - approved
      type: object
      properties:
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        approved:
          enum:
            - false
          type: boolean
      additionalProperties: false
    ActorHistory:
      required:
        - actorId
        - accountId
        - realm
        - email
        - mobile
        - firstName
        - lastName
        - approved
        - createdAt
        - deletedAt
      type: object
      properties:
        firstName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account first name. Reject surrounding spaces and control characters.'
          nullable: true
        lastName:
          maxLength: 160
          minLength: 1
          type: string
          description: 'Optional Account last name. Reject surrounding spaces and control characters.'
          nullable: true
        actorId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        accountId:
          pattern: '^[0-9a-f-]{36}$'
          type: string
          format: uuid
        realm:
          enum:
            - USER
            - ADMIN
          type: string
        email:
          maxLength: 254
          type: string
          description: 'ASCII email address normalized to lowercase.'
          format: email
        mobile:
          maxLength: 16
          minLength: 3
          pattern: '^\+[1-9][0-9]{1,14}$'
          type: string
          description: 'Required E.164 mobile number. Unique among active Accounts.'
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    Problem:
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    Liveness:
      required:
        - status
      type: object
      properties:
        status:
          enum:
            - alive
          type: string
      additionalProperties: false
    Readiness:
      required:
        - status
        - checks
      type: object
      properties:
        status:
          enum:
            - ready
            - unavailable
          type: string
        checks:
          type: object
          additionalProperties:
            enum:
              - ready
              - unavailable
            type: string
      additionalProperties: false
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  -
    name: Authentication
    description: 'Registration, contact ownership, and password login.'
  -
    name: Identity
    description: 'Current identity, access tokens, sessions, and account closure.'
  -
    name: Administration
    description: 'Admin enrollment and actor administration.'
  -
    name: System
    description: 'API liveness and dependency readiness.'
